<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The reference design of the web client (ADR-0070). Sample data and scripted answers; not part of the app. -->
<title>Sibillo Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: an app shell — conversation list on the left, one centered reading column, the composer docked below it. */
:root {
  --bg: #F7F7F5; --panel: #EFEFEC; --surface: #FFFFFF; --raised: #FFFFFF;
  --line: #E3E3DF; --line-strong: #CDCDC8; --fg: #1D1D1F; --muted: #626268; --faint: #85858C;
  --bubble: #ECECE8; --hover: rgba(29, 29, 31, .06); --scrim: rgba(12, 12, 14, .42);
  --shadow: 0 1px 2px rgba(20, 20, 22, .05), 0 10px 30px rgba(20, 20, 22, .09);
  --accent-l: #C2372A; --accent-d: #F07163; --accent-soft-l: #FBEAE7; --accent-soft-d: #3A2220;
  --accent: var(--accent-l); --accent-soft: var(--accent-soft-l); --on-accent: #FFFFFF;
  --ok: #2B7A4B; --danger: #B42318; --on-danger: #FFFFFF;
  /* The sibillo keeps its colors in both themes. */
  --c-hat: #C8352A; --c-hat-shade: #992A21; --c-tunic: #B5302A; --c-skin: #F3D6B0; --c-hair: #E1B64C;
  --c-line: #3A2A22; --c-blush: #EE9682; --c-mouth: #7A2A22; --c-wood: #9C6B3E; --c-paper: #FBF6EA; --c-glass: rgba(150, 200, 235, .45);
  --font-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-accent="moss"] { --accent-l: #2E7848; --accent-d: #6CC48C; --accent-soft-l: #E3F1E7; --accent-soft-d: #1D3326; }
:root[data-accent="dusk"] { --accent-l: #4553C4; --accent-d: #95A0F7; --accent-soft-l: #E8EAFB; --accent-soft-d: #262A48; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171719; --panel: #1E1E21; --surface: #232327; --raised: #2A2A2F;
    --line: #323238; --line-strong: #46464D; --fg: #ECECEF; --muted: #A6A6AE; --faint: #82828A;
    --bubble: #2D2D32; --hover: rgba(255, 255, 255, .07); --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
    --accent: var(--accent-d); --accent-soft: var(--accent-soft-d); --on-accent: #1B0D0B;
    --ok: #67C18B; --danger: #F2786C; --on-danger: #1B0D0B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171719; --panel: #1E1E21; --surface: #232327; --raised: #2A2A2F;
  --line: #323238; --line-strong: #46464D; --fg: #ECECEF; --muted: #A6A6AE; --faint: #82828A;
  --bubble: #2D2D32; --hover: rgba(255, 255, 255, .07); --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
  --accent: var(--accent-d); --accent-soft: var(--accent-soft-d); --on-accent: #1B0D0B;
  --ok: #67C18B; --danger: #F2786C; --on-danger: #1B0D0B;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Shell */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.app.bare { grid-template-columns: minmax(0, 1fr); }
.app.bare .sidebar, .app.bare .topbar { display: none; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 12px 10px; gap: 6px; }
.side-top { display: flex; align-items: center; gap: 6px; padding: 2px 4px 8px; }
.brand { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; flex: 1; text-align: left; border-radius: 8px; }
.brand .mz { width: 28px; height: 28px; }
.new-chat { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 9px 10px; border-radius: 10px; font-weight: 600; color: var(--fg); }
.new-chat .plus { width: 26px; height: 26px; border-radius: 999px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.new-chat .plus svg.i { width: 16px; height: 16px; stroke-width: 2.4; }
.new-chat:hover, .side-link:hover, .conv:hover { background: var(--hover); }
.convs { flex: 1; overflow-y: auto; min-height: 0; margin-top: 6px; }
.convs h2 { font-size: 12px; font-weight: 600; color: var(--faint); margin: 14px 10px 4px; letter-spacing: .02em; }
.convs ul { list-style: none; margin: 0; padding: 0; }
.conv { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.conv[aria-current="page"] { background: var(--hover); font-weight: 600; }
.side-bottom { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.side-link { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 9px; font-size: 14px; text-align: left; }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 4px 2px 10px; }
.avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 13px; flex: none; }
.me-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.25; }
.me-name small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 128px 0 16px; }
.top-title { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-title small { font-weight: 400; color: var(--muted); margin-left: 8px; }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.only-phone { display: none !important; }
.scrim { display: none; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 0; border-radius: 9px; background: none; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }

/* Buttons and fields */
.btn { height: 38px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: transparent; }
.btn.primary:hover { opacity: .9; }
.btn.danger { background: var(--danger); color: var(--on-danger); border-color: transparent; }
.btn.small { height: 32px; padding: 0 12px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 13.5px; }
.field small { color: var(--muted); font-size: 12.5px; }
.input, select.input { height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; background: var(--bg); width: 100%; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: inline-flex; padding: 3px; background: var(--hover); border-radius: 12px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-weight: 500; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }

/* Home */
.home { flex: 1; overflow-y: auto; display: flex; }
.home-inner { margin: auto; width: 100%; max-width: 760px; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 28px; }
.greeting { display: flex; align-items: center; gap: 8px; justify-content: center; }
.greeting .mz { width: 132px; height: 152px; flex: none; }
.speech { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px 22px 16px; max-width: 460px; box-shadow: var(--shadow); }
.speech::before { content: ""; position: absolute; left: -9px; top: 46%; width: 16px; height: 16px; background: var(--surface); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.speech .hello { margin: 0 0 8px; font-weight: 700; font-size: 20px; letter-spacing: -.015em; text-wrap: balance; }
.speech blockquote { margin: 0; font: italic 400 19px/1.45 var(--font-serif); text-wrap: pretty; }
.speech .by { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 13.5px; }
.speech .by span { flex: 1; }
.speech .by cite { font-style: italic; }

/* Conversation */
.thread { flex: 1; overflow-y: auto; min-height: 0; }
.col { max-width: 740px; margin: 0 auto; padding: 0 16px; }
.thread .col { padding-top: 8px; padding-bottom: 24px; }
.msg { display: flex; flex-direction: column; gap: 4px; margin: 20px 0; }
.msg.user { align-items: flex-end; }
.bubble { background: var(--bubble); padding: 10px 15px; border-radius: 20px; max-width: min(85%, 560px); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.msg-actions .icon-btn { width: 30px; height: 30px; }
.msg-actions svg.i { width: 16px; height: 16px; }
.msg:hover .msg-actions, .msg:focus-within .msg-actions, .msg.last .msg-actions { opacity: 1; }
@media (hover: none) { .msg-actions { opacity: 1; } }
.edit-box { width: min(100%, 600px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.edit-box textarea { border: 0; outline: 0; background: none; resize: none; min-height: 60px; }
.edit-box .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.edit-box .row small { flex: 1; color: var(--muted); font-size: 12.5px; }
.prose { overflow-wrap: anywhere; min-width: 0; }
.prose > :first-child { margin-top: 0; }
.prose p { margin: 0 0 12px; }
.prose h3 { font-size: 16.5px; font-weight: 700; margin: 20px 0 6px; letter-spacing: -.01em; }
.prose ul { margin: 0 0 12px; padding-left: 22px; }
.prose li { margin: 5px 0; }
.prose li::marker { color: var(--faint); }
.prose code { font-family: var(--font-mono); font-size: .86em; background: var(--hover); padding: 1px 5px; border-radius: 5px; }
.prose .table { overflow-x: auto; margin: 4px 0 14px; border: 1px solid var(--line); border-radius: 12px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14px; }
.prose th, .prose td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose tr:last-child td { border-bottom: 0; }
.prose th { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; background: var(--hover); }
.prose .checks { list-style: none; padding-left: 0; }
.prose .checks li { display: flex; gap: 10px; align-items: baseline; }
.prose .checks li::before { content: ""; width: 13px; height: 13px; border: 1.6px solid var(--line-strong); border-radius: 4px; flex: none; transform: translateY(2px); }
.prose .stopped { color: var(--muted); font-style: italic; }
.tools { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; margin-bottom: 10px; }
.tools:empty { display: none; }
details.tool summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px 5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 13.5px; max-width: 100%; }
details.tool summary::-webkit-details-marker { display: none; }
details.tool summary:hover { color: var(--fg); background: var(--hover); }
details.tool summary b { font-weight: 600; color: var(--fg); white-space: nowrap; }
details.tool summary span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
details.tool summary svg.i { width: 16px; height: 16px; }
details.tool .chev { transition: transform .15s; }
details.tool[open] .chev { transform: rotate(90deg); }
.tool-body { margin: 8px 0 4px 14px; padding: 4px 0 4px 14px; border-left: 2px solid var(--line); font-size: 13.5px; color: var(--muted); }
.tool-body ol { margin: 0; padding-left: 18px; }
.tool-body li { margin: 3px 0; }
.tool-body li span { color: var(--faint); }
.tool-body pre { margin: 0; font: 12.5px/1.5 var(--font-mono); white-space: pre-wrap; color: var(--fg); }
.run { display: flex; align-items: center; gap: 10px; min-height: 58px; margin-top: 2px; }
.run .mz { width: 46px; height: 53px; flex: none; }
.run-text { color: var(--muted); font-size: 14px; }
.run-text.live { background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 40%, var(--fg) 50%, var(--muted) 60%, var(--muted) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }

/* Composer */
.dock { flex: none; padding: 6px 0 14px; }
.composer { position: relative; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 24px; box-shadow: var(--shadow); padding: 14px 12px 10px 18px; display: flex; flex-direction: column; gap: 8px; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line-strong)); }
.composer textarea { border: 0; outline: 0; resize: none; background: none; min-height: 26px; max-height: 220px; line-height: 1.5; padding: 0; }
.composer textarea::placeholder { color: var(--faint); }
.composer-bar { display: flex; align-items: center; gap: 6px; }
.composer-bar .grow { flex: 1; }
.model-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font-weight: 500; font-size: 13.5px; padding: 6px 8px; border-radius: 9px; min-width: 0; }
.model-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-btn:hover, .model-btn[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
.model-btn svg.i { width: 16px; height: 16px; }
.send { width: 36px; height: 36px; border-radius: 12px; background: var(--accent); color: var(--on-accent); border: 0; display: grid; place-items: center; flex: none; transition: opacity .15s; }
.send svg.i { stroke-width: 2.3; }
.send:disabled { opacity: .35; cursor: default; }
.send.stop { background: var(--fg); color: var(--bg); }
.egress { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; color: var(--faint); margin: 8px 0 0; text-align: center; }
.egress svg.i { width: 14px; height: 14px; }

/* Model picker */
.picker { position: absolute; right: 6px; bottom: calc(100% + 8px); width: min(400px, calc(100vw - 32px)); max-height: min(480px, 68vh); background: var(--raised); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; z-index: 30; }
.picker-search { padding: 10px; border-bottom: 1px solid var(--line); }
.picker-search .input { height: 38px; background: var(--bg); }
.picker-list { overflow-y: auto; padding: 4px 6px 8px; }
.picker h3 { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--faint); margin: 12px 10px 4px; }
.picker h3 svg.i { width: 14px; height: 14px; }
.picker h3 em { font-style: normal; font-weight: 400; margin-left: auto; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 11px; background: none; border: 0; }
.opt:hover, .opt:focus-visible { background: var(--hover); }
.opt-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.opt-meta { grid-column: 1; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt-check { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--accent); }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.picker-foot { padding: 9px 14px; font-size: 12px; color: var(--faint); border-top: 1px solid var(--line); }
.picker-empty { padding: 18px 10px; color: var(--muted); font-size: 14px; }

/* Dialogs and toasts */
.dialog-scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50; padding: 16px; animation: fade .15s; }
.dialog { background: var(--raised); border-radius: 20px; width: min(460px, 100%); padding: 22px; box-shadow: var(--shadow); max-height: calc(100% - 32px); overflow-y: auto; animation: rise .2s cubic-bezier(.2, .8, .3, 1); }
.dialog h2 { font-size: 18px; margin: 0 0 8px; letter-spacing: -.01em; }
.dialog p { color: var(--muted); margin: 0 0 10px; }
.dialog .note { display: flex; gap: 8px; align-items: center; color: var(--fg); background: var(--hover); padding: 9px 12px; border-radius: 10px; font-size: 14px; }
.dialog form { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.toasts { position: fixed; top: calc(62px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(540px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 12px; align-items: center; background: var(--raised); border: 1px solid var(--line); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: var(--shadow); animation: rise .25s cubic-bezier(.2, .8, .3, 1); font-size: 14px; }
.toast.error { padding-left: 8px; border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.toast .mz { width: 58px; height: 67px; flex: none; }
.toast-text { flex: 1; min-width: 0; }
.toast-text strong { display: block; margin-bottom: 2px; }
.toast-text p { margin: 0 0 8px; color: var(--muted); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }

/* Connection test */
.test-result { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
.test-result.ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.test-result.fail { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
.tr-head { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14.5px; }
.test-result.ok .tr-head svg.i { color: var(--ok); }
.test-result.fail .tr-head svg.i { color: var(--danger); }
.dialog .test-result p { margin: 0; color: var(--muted); }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.stages li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; }
.stages .st-label { font-weight: 600; }
.stages .st-detail { grid-column: 2 / span 2; color: var(--muted); font: 12px/1.45 var(--font-mono); overflow-wrap: anywhere; }
.stages .st-ms { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.stages .st-ico { display: grid; place-items: center; width: 18px; height: 18px; }
.stages .st-ico svg.i { width: 15px; height: 15px; stroke-width: 2.4; }
.stages li.ok .st-ico { color: var(--ok); }
.stages li.fail .st-ico, .stages li.fail .st-detail { color: var(--danger); }
.stages li.skip { color: var(--faint); }
.stages li.skip .st-label { font-weight: 500; }
.stages li.run .st-ico::before, .tr-head .spin { content: ""; width: 12px; height: 12px; border-radius: 999px; border: 2px solid var(--muted); border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; flex: none; }
.test-result details summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
.test-result pre { font: 12px/1.5 var(--font-mono); background: var(--hover); padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
.sim { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.sim .k { font-size: 12px; color: var(--faint); font-weight: 600; }
.sim .seg button { padding: 4px 9px; font-size: 12.5px; }
.dialog-actions .grow { flex: 1; }

/* Settings */
.page { flex: 1; overflow-y: auto; }
.page-inner { max-width: 900px; margin: 0 auto; padding: 8px 16px 56px; display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 36px; }
.page h1 { grid-column: 1 / -1; font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.tabs button { text-align: left; border: 0; background: none; padding: 8px 12px; border-radius: 9px; color: var(--muted); font-weight: 500; display: flex; gap: 10px; align-items: center; }
.tabs button:hover { background: var(--hover); color: var(--fg); }
.tabs button[aria-current="page"] { background: var(--hover); color: var(--fg); font-weight: 600; }
.sections { display: flex; flex-direction: column; gap: 34px; min-width: 0; }
.sections h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; max-width: 62ch; }
.conns { display: flex; flex-direction: column; gap: 10px; }
.conn { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.conn-icon { grid-row: 1 / span 2; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.conn-name { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.conn-sub { color: var(--muted); font-size: 13px; grid-column: 2; overflow-wrap: anywhere; }
.conn .pill { grid-row: 1 / span 2; grid-column: 3; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.pill.checking { color: var(--muted); background: var(--hover); }
.pill.checking::before { content: ""; width: 10px; height: 10px; border-radius: 999px; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.tag { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.tag svg.i { width: 12px; height: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.add-row { margin-top: 12px; }
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 480px; }
.theme-card { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; font-weight: 600; font-size: 14px; }
.theme-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.swatch { height: 44px; border-radius: 8px; border: 1px solid var(--line); }
.swatch.s-light { background: linear-gradient(90deg, #EFEFEC 30%, #F7F7F5 30%); }
.swatch.s-dark { background: linear-gradient(90deg, #1E1E21 30%, #171719 30%); }
.swatch.s-system { background: linear-gradient(135deg, #F7F7F5 50%, #171719 50%); }

/* Sign-in */
.signin { flex: 1; overflow-y: auto; display: flex; padding: 24px 16px; }
.signin-card { margin: auto; width: min(360px, 100%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.signin-card .mz { width: 92px; height: 106px; }
.signin-card h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; text-align: center; }
.signin-card > p { color: var(--muted); margin: 0 0 18px; text-align: center; }
.signin-card form { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.signin-card .btn { width: 100%; height: 42px; }

/* Poses */
.poses { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.pose-card { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.pose-card .mz { width: 116px; height: 134px; }
.pose-card b { font-size: 14.5px; }
.pose-card span { color: var(--muted); font-size: 13px; }

/* Prototype controls: not part of the app */
.proto { position: fixed; top: calc(9px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 70; }
.proto-pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--line-strong); background: var(--raised); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.proto-pill svg.i { width: 15px; height: 15px; }
.proto-card { position: absolute; right: 0; top: calc(100% + 8px); width: min(296px, calc(100vw - 24px)); background: var(--raised); border: 1px dashed var(--line-strong); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
.proto-card .k { font-weight: 600; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.proto-card .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.proto-card p { margin: 0; color: var(--faint); font-size: 12px; }

/* The sibillo */
.mz { display: block; overflow: visible; }
.mz .pose { display: none; }
.mz[data-state="idle"] .pose-idle, .mz[data-state="still"] .pose-idle, .mz[data-state="answering"] .pose-idle,
.mz[data-state="greeting"] .pose-wave, .mz[data-state="thinking"] .pose-think, .mz[data-state="searching"] .pose-search,
.mz[data-state="reading"] .pose-read, .mz[data-state="writing"] .pose-write, .mz[data-state="knocking"] .pose-knock,
.mz[data-state="error"] .pose-sign { display: inline; }
.mz .fig { transform-origin: 100px 212px; animation: mz-breathe 3.2s ease-in-out infinite; }
.mz .hat { transform-origin: 100px 94px; animation: mz-sway 4.5s ease-in-out infinite; }
.mz[data-state="still"] .fig, .mz[data-state="still"] .hat { animation: none; }
.mz[data-state="answering"] .fig { animation: mz-bob .9s ease-in-out infinite; }
.mz[data-state="greeting"] .fig { animation: mz-hop 4s ease-in-out infinite; }
.mz .wave-arm { transform-origin: 109px 128px; animation: mz-wave 4s ease-in-out infinite; }
.mz[data-state="thinking"] .head { transform-origin: 100px 124px; animation: mz-tilt 2.6s ease-in-out infinite alternate; }
.mz .dot { animation: mz-dot 1.5s ease-in-out infinite; }
.mz .d2 { animation-delay: .2s; } .mz .d3 { animation-delay: .4s; }
.mz .lens-arm { transform-origin: 109px 128px; animation: mz-scan 2.4s ease-in-out infinite; }
.mz[data-state="searching"] .head { transform-origin: 100px 124px; animation: mz-look 2.4s ease-in-out infinite; }
.mz .page-flip { transform-origin: 100px 150px; animation: mz-flip 2.8s ease-in-out infinite; }
.mz[data-state="reading"] .head { transform-origin: 100px 124px; transform: translateY(2px) rotate(-2deg); }
.mz .pencil-arm { transform-origin: 109px 128px; animation: mz-scribble .42s ease-in-out infinite alternate; }
.mz .ink { stroke-dasharray: 46; animation: mz-ink 2.7s linear infinite; }
.mz .mallet-arm { transform-origin: 109px 128px; animation: mz-knock .8s cubic-bezier(.55, 0, .6, 1) infinite; }
.mz .bang { animation: mz-bang .8s linear infinite; }
.mz .sign-arm { transform-origin: 109px 128px; animation: mz-wobble 1.3s ease-in-out infinite alternate; }
@keyframes mz-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
@keyframes mz-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes mz-sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes mz-hop { 0%, 30%, 100% { transform: translateY(0); } 8% { transform: translateY(-10px); } 16% { transform: translateY(0); } 21% { transform: translateY(-4px); } }
@keyframes mz-wave { 0%, 55%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(-18deg); } 20%, 40% { transform: rotate(12deg); } }
@keyframes mz-tilt { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
@keyframes mz-dot { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
@keyframes mz-scan { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(10deg); } }
@keyframes mz-look { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
@keyframes mz-flip { 0%, 35% { transform: scaleX(1); } 60%, 100% { transform: scaleX(-1); } }
@keyframes mz-scribble { from { transform: rotate(-2.5deg); } to { transform: rotate(2deg) translateY(1px); } }
@keyframes mz-ink { 0% { stroke-dashoffset: 46; } 80%, 100% { stroke-dashoffset: 0; } }
@keyframes mz-knock { 0% { transform: rotate(-28deg); } 55% { transform: rotate(38deg); } 65% { transform: rotate(30deg); } 100% { transform: rotate(-28deg); } }
@keyframes mz-bang { 0%, 50% { opacity: 0; } 56% { opacity: 1; } 80%, 100% { opacity: 0; } }
@keyframes mz-wobble { from { transform: rotate(-4deg); } to { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) {
  .mz, .mz * { animation: none !important; }
  .run-text.live { animation: none; color: var(--muted); background: none; }
  .toast, .dialog, .dialog-scrim { animation: none; }
}

/* Phones */
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-100%); transition: transform .25s cubic-bezier(.2, .8, .3, 1); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); }
  .app.drawer .sidebar { transform: none; box-shadow: var(--shadow); }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 35; }
  .only-phone { display: inline-grid !important; }
  .topbar { padding-left: max(8px, env(safe-area-inset-left, 0px)); }
  .greeting { flex-direction: column; gap: 14px; }
  .greeting .mz { width: 108px; height: 124px; }
  .speech::before { left: calc(50% - 8px); top: -9px; transform: rotate(135deg); }
  .speech { padding: 16px 18px 14px; }
  .home-inner { gap: 22px; }
  .page-inner { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .tabs { flex-direction: row; overflow-x: auto; }
  .dock { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .themes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversations"></aside>

  <div class="main">

    <div id="view"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<div id="dialogs"></div>
<div class="proto" id="proto"></div>

<script>

/* Rendering */
function render() {
  const app = $("#app");
  app.classList.toggle("bare", S.view === "signin");
  app.classList.remove("drawer");
  renderSidebar();
  renderTopbar();
  const view = $("#view");
  if (S.view === "home") view.innerHTML = homeHTML();
  else if (S.view === "chat") view.innerHTML = chatHTML();
  else if (S.view === "settings") view.innerHTML = settingsHTML();
  else if (S.view === "poses") view.innerHTML = posesHTML();
  else view.innerHTML = signinHTML();
  afterRender();
}

function renderSidebar() {
  const groups = [];
  for (const c of conversations) {
    let g = groups.find((x) => x.when === c.when);
    if (!g) groups.push((g = { when: c.when, items: [] }));
    g.items.push(c);
  }
  $("#sidebar").innerHTML = `
    <div class="side-top">
      <button class="brand" data-action="home">${creature("still", "52 12 96 118")}<span>Sibillo</span></button>
      <button class="icon-btn only-phone" data-action="close-menu" aria-label="Close the conversation list">${icon("x")}</button>

    <nav class="convs" aria-label="Recent conversations">
      ${groups.map((g) => `<h2>${g.when}</h2><ul>${g.items.map((c) =>
        `<li><button class="conv" data-action="open" data-id="${c.id}" ${S.view === "chat" && c.id === S.convId ? 'aria-current="page"' : ""}>${esc(c.title)}</button></li>`).join("")}</ul>`).join("")}
    </nav>
    <div class="side-bottom">
      <button class="side-link" data-action="settings">${icon("sliders")}Settings</button>
      <div class="me">

        <button class="icon-btn" data-action="signout" aria-label="Sign out" title="Sign out">${icon("logout")}</button>
      </div>
    </div>`;
}

function renderTopbar() {

  if (S.view === "chat" && c) title = `${esc(c.title)}${c.forkedFrom ? `<small>Forked from “${esc(c.forkedFrom)}”</small>` : ""}`;
  if (S.view === "settings") title = "Settings";

    <button class="icon-btn only-phone" data-action="menu" aria-label="Open the conversation list">${icon("menu")}</button>

  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

}

function pickerHTML() {
  return `<div class="picker" role="dialog" aria-label="Choose a model">

function pickerListHTML() {
  const q = S.pickerQuery.trim().toLowerCase();
  const fits = (m) => !q || m.name.toLowerCase().includes(q) || CONNS[m.conn].name.toLowerCase().includes(q);
  const section = (connId, iconName, note) => {
    const list = MODELS.filter((m) => m.conn === connId && fits(m));
    if (!list.length) return "";
    return `<h3>${icon(iconName)}${CONNS[connId].name}<em>${note}</em></h3>` + list.map((m) => `
      <button type="button" class="opt" data-action="pick" data-id="${m.id}">
        <span class="opt-name">${esc(m.name)}${m.id === S.defaultModel ? '<span class="badge">Default</span>' : ""}</span>
        <span class="opt-meta">${priceOf(m)}</span>
        <span class="opt-check">${m.id === S.model ? icon("check") : ""}</span>
      </button>`).join("");
  };
  const html = section("home", "home", "Runs at home") + section("or", "cloud", "Most used this week");
  return html || `<p class="picker-empty">No model matches “${esc(S.pickerQuery)}”.</p>`;
}

function toolHTML(t) {

}

function chatHTML() {
  const c = conv();
  const lastBot = c.messages.map((m) => m.role).lastIndexOf("bot");
  const msgs = c.messages.map((m, i) => {
    if (m.role === "user") {
      if (S.editing === i) {
        return `<div class="msg user"><div class="edit-box">
          <textarea id="edit-text" aria-label="Edit your message">${esc(m.text)}</textarea>
          <div class="row"><small>Sending deletes the messages after this one.</small>
            <button class="btn small" data-action="edit-cancel">Cancel</button>
            <button class="btn small primary" data-action="edit-send" data-i="${i}">Send</button></div>
        </div></div>`;
      }
      return `<div class="msg user"><div class="bubble">${esc(m.text)}</div>
        <div class="msg-actions">
          <button class="icon-btn" data-action="copy" data-i="${i}" aria-label="Copy" title="Copy">${icon("copy")}</button>
          <button class="icon-btn" data-action="edit" data-i="${i}" aria-label="Edit" title="Edit"${S.running ? " disabled" : ""}>${icon("pencil")}</button>
        </div></div>`;
    }
    const last = i === lastBot;
    const run = last ? `<div class="run" role="status">${creature(m.live ? m.state : "still")}<span class="run-text ${m.live ? "live" : ""}">${m.live ? esc(m.status) : ""}</span></div>` : "";
    return `<div class="msg bot ${last ? "last" : ""}" ${m.live ? "data-live" : ""}>
      <div class="tools">${(m.tools || []).map(toolHTML).join("")}</div>
      <div class="prose">${m.html || ""}</div>
      ${run}
      ${m.live ? "" : `<div class="msg-actions">
        <button class="icon-btn" data-action="copy" data-i="${i}" aria-label="Copy" title="Copy">${icon("copy")}</button>
        <button class="icon-btn" data-action="fork" data-i="${i}" aria-label="Fork from here" title="Fork from here">${icon("fork")}</button>
      </div>`}
    </div>`;
  }).join("");
  return `<div class="thread" id="thread"><div class="col">${msgs}</div></div>
    <div class="dock"><div class="col">${composerHTML("Reply…")}</div></div>`;
}

  }
  const edit = $("#edit-text");
  if (edit) { autosize(edit); edit.focus(); edit.setSelectionRange(edit.value.length, edit.value.length); }
  const q = $("#model-q");
  if (q) q.focus();
  const thread = $("#thread");
  if (thread && S.editing === null) thread.scrollTop = thread.scrollHeight;
}

function autosize(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }

/* Runs, scripted */
function setLive(state, status) {
  const m = conv() && conv().messages.at(-1);
  if (m && m.live) { m.state = state; m.status = status; }
  const live = document.querySelector("[data-live]");
  if (!live) return;
  live.querySelector(".mz").setAttribute("data-state", state);
  const text = live.querySelector(".run-text");
  text.textContent = status;
}

function addTool(m, tool) {
  m.tools.push(tool);
  const live = document.querySelector("[data-live] .tools");
  if (live) live.insertAdjacentHTML("beforeend", toolHTML(tool));
  scrollDown();
}

function scrollDown() { const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight; }

const ANSWER_TEXT = "This prototype makes up its answers, but the steps above are the real ones the assistant takes: it searched the web, read the pages, saved notes.md to your workspace and turned it into a PDF. Open any step to see what it did.";
const ANSWER_HTML = `<p>This prototype makes up its answers, but the steps above are the real ones the assistant takes:</p>
<ul><li>It <b>searched the web</b> and <b>read the pages</b> it found.</li><li>It <b>saved <code>notes.md</code></b> to your workspace and <b>turned it into a PDF</b>.</li></ul>
<p>Open any step to see what it did. The sibillo below now waits for your next message.</p>`;

async function startRun(c) {
  S.running = true; S.stopRequested = false; S.picker = false;
  const question = c.messages.at(-1).text;
  const m = { role: "bot", tools: [], html: "", live: true, state: "thinking", status: "Thinking…" };
  c.messages.push(m);
  render();
  const short = question.length > 34 ? question.slice(0, 32).trimEnd() + "…" : question;
  const steps = [
    ["thinking", "Thinking…", 1300],
    ["searching", `Searching the web for “${short}”`, 2300, { kind: "search", label: "Searched the web", meta: "3 results", body: SEARCH_RESULTS }],
    ["reading", "Reading 3 pages", 2000, { kind: "read", label: "Read 3 pages", meta: "gallerianazionalemarche.it and 2 more", body: "<ol><li>Opening hours and family tickets</li><li>The house where Raphael was born</li><li>Walks, parks and lookouts</li></ol>" }],
    ["writing", "Writing notes.md", 1800, { kind: "write", label: "Saved notes.md", meta: "in your workspace", body: "<pre>notes.md · 1.2 KB</pre>" }],
    ["knocking", "Running pandoc notes.md -o notes.pdf", 1900, { kind: "run", label: "Ran a command", meta: "pandoc notes.md -o notes.pdf", body: "<pre>$ pandoc notes.md -o notes.pdf\nDone in 0.8 s</pre>" }],
  ];
  for (const [state, status, ms, tool] of steps) {
    if (S.stopRequested) break;
    setLive(state, status);
    await sleep(ms);
    if (S.stopRequested) break;
    if (tool) addTool(m, tool);
  }
  if (!S.stopRequested) {
    setLive("answering", "Answering…");
    const prose = document.querySelector("[data-live] .prose");
    const words = ANSWER_TEXT.split(" ");
    let shown = "";
    for (const w of words) {
      if (S.stopRequested) break;
      shown += (shown ? " " : "") + w;
      m.html = `<p>${esc(shown)}</p>`;
      const p = document.querySelector("[data-live] .prose");
      if (p) p.innerHTML = m.html;
      scrollDown();
      await sleep(45);
    }
    if (!S.stopRequested) m.html = ANSWER_HTML;
    void prose;
  }
  if (S.stopRequested) m.html = (m.html || "") + '<p class="stopped">Stopped.</p>';
  m.live = false;
  S.running = false;
  if (c.title === "New conversation") c.title = question.length > 40 ? question.slice(0, 38).trimEnd() + "…" : question;
  if (S.view === "chat" && S.convId === c.id) render(); else renderSidebar();
}

function send(text) {
  text = text.trim();
  if (!text || S.running) return;
  let c = conv();
  if (S.view !== "chat" || !c) {
    c = { id: "c" + Date.now(), title: "New conversation", when: "Today", model: S.model, messages: [] };
    conversations.unshift(c);
    S.convId = c.id; S.view = "chat";
  }
  c.model = S.model;
  c.messages.push({ role: "user", text });
  startRun(c);
}

/* Dialogs and toasts */
function openDialog(html, onOk) {
  S.pendingDialog = onOk;
  $("#dialogs").innerHTML = `<div class="dialog-scrim" data-action="dlg-scrim">${html}</div>`;
  const first = $("#dialogs").querySelector("input, select, [data-action='dlg-ok'], button");
  if (first) first.focus();
}
function closeDialog() { $("#dialogs").innerHTML = ""; S.pendingDialog = null; }

function toast(kind, title, text, action = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.setAttribute("role", kind === "error" ? "alert" : "status");
  el.innerHTML = `${kind === "error" ? creature("error") : ""}
    <div class="toast-text">${title ? `<strong>${title}</strong>` : ""}${text ? `<p>${text}</p>` : ""}${action}</div>
    <button class="icon-btn" data-action="toast-close" aria-label="Dismiss">${icon("x")}</button>`;
  $("#toasts").append(el);
  if (kind !== "error") setTimeout(() => el.remove(), 2600);
}

function connectionDialog(type) {
  const or = type === "or";
  return `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <h2 id="dlg-t">Add a connection</h2>
    <div class="seg" role="group" aria-label="Kind of connection">
      <button type="button" data-action="conn-type" data-v="or" aria-pressed="${or}">OpenRouter</button>
      <button type="button" data-action="conn-type" data-v="server" aria-pressed="${!or}">Your own server</button>
    </div>
    <form id="conn-form" data-type="${type}">
      ${or ? `
        <div class="field"><label for="or-key">API key</label><input class="input" id="or-key" type="password" placeholder="sk-or-…" autocomplete="off" required>
          <small>Create one at openrouter.ai, under Keys. Every OpenRouter model becomes available to the household, most used first.</small></div>`
      : `
        <div class="field"><label for="srv-name">Name</label><input class="input" id="srv-name" value="Gaming PC" required></div>
        <div class="field"><label for="srv-url">Address</label><input class="input" id="srv-url" value="http://192.168.1.20:11434/v1" required>
          <small>Ollama, llama.cpp, vLLM or LM Studio. Addresses on your network work because you also run this server.</small></div>
        <div class="field"><label for="srv-key">API key <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input class="input" id="srv-key" type="password" autocomplete="off"></div>`}
      <div id="conn-result"></div>
      <div class="sim" role="group" aria-label="Prototype: what the test finds">
        <span class="k">Prototype: what the test finds</span>
        <div class="seg">${SIMS[type].map(([v, l]) => `<button type="button" data-action="sim" data-v="${v}" aria-pressed="${S.sim === v}">${l}</button>`).join("")}</div>
      </div>
      <div class="dialog-actions" style="margin-top:4px">
        <button type="button" class="btn" data-action="conn-test">Test connection</button>
        <span class="grow"></span>
        <button type="button" class="btn" data-action="dlg-close">Cancel</button>
        <button type="submit" class="btn primary">Connect</button>
      </div>
    </form>
  </div>`;
}

/* The connection test, scripted: each step with its result, and why it failed */
const SIMS = {
  or: [["ok", "Works"], ["auth", "Wrong key"], ["timeout", "Timeout"]],
  server: [["ok", "Works"], ["refused", "Refused"], ["dns", "Unknown name"], ["notfound", "404"], ["timeout", "Timeout"], ["tls", "Bad certificate"]],
};

function testPlan(type, sim) {
  const outcome = (stages, failAt, detail, title, fix, raw, failMs) => {
    if (failAt === undefined) return { ok: true, stages, title, fix };
    return {
      ok: false, title, fix, raw,
      stages: stages.map((s, i) => (i < failAt ? s : i === failAt ? { ...s, state: "fail", detail, ms: failMs ?? s.failMs } : { ...s, state: "skip", detail: "Not tried", ms: null })),
    };
  };
  const st = (label, detail, ms, failMs = ms) => ({ label, detail, ms, failMs, state: "ok" });
  if (type === "or") {
    const stages = [
      st("Find openrouter.ai", "104.18.2.115", 11),
      st("Connect", "port 443", 19, 10000),
      st("Secure connection", "TLS 1.3, certificate valid", 31),
      st("Check the key", "GET /api/v1/key → 200 OK", 142),
      st("List the models", "GET /api/v1/models → 200 OK, 342 models", 210),
    ];
    if (sim === "auth") return outcome(stages, 3, "GET /api/v1/key → 401 Unauthorized", "OpenRouter didn't accept the key",
      "Copy the key again from openrouter.ai, under Keys. Keys start with sk-or-, and a deleted or disabled key stops working.",
      'HTTP/1.1 401 Unauthorized\n{"error":{"message":"User not found.","code":401}}');
    if (sim === "timeout") return outcome(stages, 1, "no answer after 10 s", "OpenRouter didn't answer",
      "This server couldn't reach openrouter.ai within 10 seconds. Check that it can reach the internet, then try again.",
      "connect ETIMEDOUT 104.18.2.115:443 (10000 ms)");
    return outcome(stages, undefined, "", "Connected to OpenRouter", "The key works and 342 models are available. The test took 0.4 s.");
  }
  let url;
  try { url = new URL($("#srv-url").value); } catch { url = new URL("http://192.168.1.20:11434/v1"); }
  const host = url.hostname, https = url.protocol === "https:";
  const port = url.port || (https ? "443" : "80");
  const path = url.pathname.replace(/\/$/, "");
  const ip = /^[\d.]+$/.test(host);
  const stages = [
    st(`Find ${host}`, ip ? "an IP address, nothing to look up" : "192.168.1.20", ip ? 0 : 4),
    st("Connect", `port ${port}`, 3, 10000),
    ...(https ? [st("Secure connection", "certificate valid", 12)] : []),
    st("List the models", `GET ${path}/models → 200 OK`, 48),
    st("Read the answer", "2 models: qwen3:8b, gemma3:12b", 1),
  ];
  const list = stages.findIndex((s) => s.label === "List the models");
  if (sim === "refused") return outcome(stages, 1, `${host}:${port} refused the connection`, `Nothing answered on port ${port}`,
    `The machine at ${host} is on, but no program listens on port ${port}. Check that the model server is running and listens on the network: Ollama listens only on 127.0.0.1 unless OLLAMA_HOST is set to 0.0.0.0.`,
    `connect ECONNREFUSED ${host}:${port} (2 ms)`, 2);
  if (sim === "dns") return outcome(stages, 0, "no such name", `${host} doesn't exist on your network`,
    "This server can't find that name. Use the machine's IP address instead, or give it a fixed name in your router.",
    `getaddrinfo ENOTFOUND ${host}`);
  if (sim === "notfound") return outcome(stages, list, `GET ${path}/models → 404 Not Found`, "The address answers, but it isn't a model server",
    "Most servers expect /v1 at the end of the address, for example http://192.168.1.20:11434/v1.",
    `HTTP/1.1 404 Not Found\nContent-Type: text/plain\n\n404 page not found`);
  if (sim === "timeout") return outcome(stages, 1, "no answer after 10 s", `${host} didn't answer`,
    "The machine may be off or asleep, or a firewall drops the connection. Check that this server can reach it.",
    `connect ETIMEDOUT ${host}:${port} (10000 ms)`);
  if (sim === "tls") return outcome(stages, 2, "self-signed certificate", "The server's certificate isn't trusted",
    "The server uses a certificate this server can't verify. On your home network, use http:// instead, or give the server a certificate from a trusted authority.",
    "unable to verify the first certificate (DEPTH_ZERO_SELF_SIGNED_CERT)");
  return outcome(stages, undefined, "", `Connected to ${$("#srv-name").value || host}`, "2 models are available. The test took 0.1 s.");
}

const stageHTML = (s) => {
  const ico = s.state === "ok" ? icon("check") : s.state === "fail" ? icon("x") : s.state === "skip" ? "–" : "";
  const ms = s.state === "run" || s.ms === null ? "" : s.ms >= 1000 ? `${(s.ms / 1000).toFixed(0)} s` : `${s.ms} ms`;
  return `<li class="${s.state}"><span class="st-ico">${ico}</span><span class="st-label">${esc(s.label)}</span><span class="st-ms">${ms}</span>
    ${s.state === "run" ? "" : `<span class="st-detail">${esc(s.detail)}</span>`}</li>`;
};

async function runConnectionTest() {
  const form = $("#conn-form");
  const box = $("#conn-result");
  if (!form || !box || S.testing) return null;
  S.testing = true;
  const plan = testPlan(form.dataset.type, S.sim);
  const shown = [];
  for (const s of plan.stages) {
    if (s.state === "skip") break;
    box.innerHTML = `<div class="test-result" role="status"><div class="tr-head"><span class="spin"></span>Testing the connection…</div>
      <ol class="stages">${[...shown, { ...s, state: "run" }].map(stageHTML).join("")}</ol></div>`;
    await sleep(s.state === "fail" ? 900 : 380);
    shown.push(s);
  }
  box.innerHTML = `<div class="test-result ${plan.ok ? "ok" : "fail"}" role="${plan.ok ? "status" : "alert"}">
    <div class="tr-head">${icon(plan.ok ? "check" : "x")}${esc(plan.title)}</div>
    <p>${esc(plan.fix)}</p>
    <ol class="stages">${plan.stages.map(stageHTML).join("")}</ol>
    ${plan.raw ? `<details><summary>Technical details</summary><pre>${esc(plan.raw)}</pre></details>` : ""}
  </div>`;
  S.testing = false;
  return plan.ok;
}

/* Theme */
function applyTheme() {
  const root = document.documentElement;
  if (S.theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", S.theme);
  if (S.accent === "red") root.removeAttribute("data-accent"); else root.setAttribute("data-accent", S.accent);
}

/* Events */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-action]");
  if (S.picker && !e.target.closest(".picker") && !e.target.closest(".model-btn")) { S.picker = false; S.pickerQuery = ""; rerenderComposer(); }
  if (S.proto && !e.target.closest("#proto")) { S.proto = false; renderProto(); }
  if (!el) return;
  const a = el.dataset.action;
  const i = Number(el.dataset.i);
  const c = conv();
  switch (a) {
    case "home": case "new": S.view = "home"; S.editing = null; if (!S.running) S.model = S.defaultModel; render(); break;
    case "open": { const t = conversations.find((x) => x.id === el.dataset.id); S.convId = t.id; S.model = t.model; S.view = "chat"; S.editing = null; render(); break; }
    case "settings": S.view = "settings"; $("#toasts").innerHTML = ""; render(); break;
    case "poses": S.view = "poses"; S.proto = false; renderProto(); render(); break;
    case "signout": S.view = "signin"; S.proto = false; renderProto(); render(); break;
    case "menu": $("#app").classList.add("drawer"); break;
    case "close-menu": $("#app").classList.remove("drawer"); break;
    case "quote": { let n; do { n = Math.floor(Math.random() * QUOTES.length); } while (n === S.quote); S.quote = n; render(); break; }
    case "picker": S.picker = !S.picker; S.pickerQuery = ""; rerenderComposer(); break;
    case "pick": S.model = el.dataset.id; if (c && S.view === "chat") c.model = S.model; S.picker = false; S.pickerQuery = ""; rerenderComposer(); break;
    case "stop": S.stopRequested = true; setLive("still", "Stopping…"); break;
    case "copy": {
      const m = c.messages[i];
      const text = m.text || el.closest(".msg").querySelector(".prose").innerText;
      try { await navigator.clipboard.writeText(text); toast("info", "Copied"); } catch { toast("info", "Copying isn't allowed here"); }
      break;
    }
    case "edit": if (!S.running) { S.editing = i; render(); } break;
    case "edit-cancel": S.editing = null; render(); break;
    case "edit-send": {
      const text = $("#edit-text").value.trim();
      if (!text) break;
      const after = c.messages.length - i - 1;
      const doIt = () => { c.messages = c.messages.slice(0, i); c.messages.push({ role: "user", text }); S.editing = null; closeDialog(); startRun(c); };
      if (after === 0) { doIt(); break; }
      openDialog(`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
        <h2 id="dlg-t">Send the edited message?</h2>
        <p id="dlg-d">The ${after} ${after === 1 ? "message" : "messages"} after it will be deleted. This can't be undone.</p>
        <p class="note">${icon("filePen")}Files in your workspace stay as they are.</p>
        <div class="dialog-actions"><button class="btn" data-action="dlg-close">Cancel</button><button class="btn danger" data-action="dlg-ok">Delete and send</button></div>
      </div>`, doIt);
      break;
    }
    case "fork": {
      const copy = { id: "f" + Date.now(), title: c.title, when: "Today", model: c.model, forkedFrom: c.title, messages: structuredClone(c.messages.slice(0, i + 1)) };
      conversations.unshift(copy);
      S.convId = copy.id; S.view = "chat"; render();
      toast("info", "Forked into a new conversation", "The original stays as it was.");
      break;
    }
    case "dlg-ok": if (S.pendingDialog) S.pendingDialog(); break;
    case "dlg-close": closeDialog(); break;
    case "dlg-scrim": if (e.target === el) closeDialog(); break;
    case "toast-close": el.closest(".toast").remove(); break;
    case "tab": S.tab = el.dataset.v; render(); break;
    case "theme": S.theme = el.dataset.v; applyTheme(); renderProto(); if (S.view === "settings") render(); break;
    case "accent": S.accent = el.dataset.v; applyTheme(); renderProto(); break;
    case "proto": S.proto = !S.proto; renderProto(); break;
    case "add-conn": S.sim = "ok"; openDialog(connectionDialog("or")); break;
    case "conn-type": S.sim = "ok"; openDialog(connectionDialog(el.dataset.v)); break;
    case "conn-test": runConnectionTest(); break;
    case "sim": {
      S.sim = el.dataset.v;
      el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
      $("#conn-result").innerHTML = "";
      const address = $("#srv-url");
      if (address) {
        // A name to look up, or https to verify, makes those failures possible.
        if (S.sim === "dns") address.value = "http://gaming-pc.home:11434/v1";
        else if (S.sim === "tls") address.value = "https://192.168.1.20:8443/v1";
        else if (S.sim === "notfound") address.value = "http://192.168.1.20:11434";
        else address.value = "http://192.168.1.20:11434/v1";
      }
      break;
    }
    case "demo-run": {
      S.proto = false; renderProto();
      if (S.running) break;
      if (S.view !== "chat") { S.view = "home"; render(); }
      send("Find three rainy-day ideas for the kids in Urbino and save them as a PDF");
      break;
    }
    case "demo-error":
      S.proto = false; renderProto();
      toast("error", "OpenRouter didn't accept the API key", "The answer stopped here. A household admin can replace the key in Settings, under Models.",
        `<button class="btn small" data-action="settings">Open settings</button>`);
      break;
  }
});

function rerenderComposer() {
  const wrap = document.querySelector(".composer-wrap");
  if (!wrap) return;
  const text = $("#prompt") ? $("#prompt").value : "";
  wrap.outerHTML = composerHTML(S.view === "home" ? "What can I help with?" : "Reply…");
  const p = $("#prompt");
  p.value = text; autosize(p);
  const send = $("#send"); if (send) send.disabled = !text.trim();
  const q = $("#model-q"); if (q) q.focus(); else if (!matchMedia("(hover: none)").matches) p.focus({ preventScroll: true });
}

document.addEventListener("input", (e) => {
  if (e.target.id === "prompt") { autosize(e.target); const s = $("#send"); if (s) s.disabled = !e.target.value.trim(); }
  if (e.target.id === "edit-text") autosize(e.target);
  if (e.target.id === "model-q") { S.pickerQuery = e.target.value; $("#picker-list").innerHTML = pickerListHTML(); }
});

document.addEventListener("change", (e) => {
  if (e.target.id === "default-model") { S.defaultModel = e.target.value; toast("info", "Default model saved"); }
});

document.addEventListener("keydown", (e) => {
  if (e.target.id === "prompt" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(e.target.value); }
  if (e.key === "Escape") {
    if ($("#dialogs").innerHTML) closeDialog();
    else if (S.picker) { S.picker = false; S.pickerQuery = ""; rerenderComposer(); }
    else if (S.editing !== null) { S.editing = null; render(); }
    else $("#app").classList.remove("drawer");
  }
});

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.id === "composer") send($("#prompt").value);
  if (e.target.id === "signin") { S.view = "home"; render(); }
  if (e.target.id === "conn-form") {
    // Connecting tests first; a connection that fails the test is not saved.
    const or = e.target.dataset.type === "or";
    const name = or ? "OpenRouter" : $("#srv-name").value || "Your server";
    const sub = or ? "openrouter.ai · second key" : $("#srv-url").value;
    if (!(await runConnectionTest())) return;
    await sleep(700);
    const entry = { id: "c" + Date.now(), name, kind: or ? "remote" : "local", sub, models: or ? 342 : 2, status: "ok" };
    S.conns.push(entry);
    closeDialog(); render();
    toast("info", `${esc(entry.name)} is connected`, `${entry.models} models are now in the model list.`);
  }
});

applyTheme();
renderProto();
render();
</script>
</body>
</html>
