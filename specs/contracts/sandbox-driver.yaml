openapi: 3.1.0
info:
  title: Sibillo sandbox driver API
  version: 0.2.0-draft
  summary: Internal API between the control plane and the sandbox driver (ADR-0022).
  description: |
    The sandbox driver is the only component with access to the container
    runtime (SBX-009). This API is internal: it is reachable only on the
    internal network shared with the control plane and is never published on
    a host port (OPS-003).

    The driver knows nothing about users or permissions: the control plane
    authorizes every request before calling it. Sandboxes are addressed by
    tenant and user identifiers, from which the driver derives container and
    volume names. No request parameter can change the fixed sandbox policy
    (runtime, image, network, limits, privileges, mounts) of ADR-0022.

    Operations marked `x-phase: 1` are part of the contract but implemented
    in phase 1.

    The control plane presents this API to agents as a Pydantic AI workspace
    backend (ADR-0035), so `exec` follows the workspace protocol: stdin at
    end of file, complete output, the real exit code, timeouts, and commands
    given either as an argv list or as a shell string.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: /v1

security:
  - controlPlaneSecret: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Readiness of the driver and of sandbox isolation.
      description: |
        Healthy only when the isolation runtime is registered and recent
        enough, the egress table is in place, and the startup canary sandbox
        passed (SBX-003, SBX-015, SBX-017).
      x-requirements: [SBX-003, SBX-015, SBX-017, OPS-002, OPS-009]
      responses:
        "200":
          description: Ready to start sandboxes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready; `ensure` and `exec` are refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/ensure:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: ensureSandbox
      summary: Create the conversation's sandbox, or return it if it is running (idempotent).
      description: |
        A sandbox that is not running is always created anew from the
        sandbox image, with the conversation's workspace (SBX-018, ADR-0076).
      x-requirements: [SBX-001, SBX-002, SBX-012, SBX-015, SBX-018]
      responses:
        "200":
          description: The sandbox is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/exec:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: execInSandbox
      summary: Run a command in the conversation's sandbox and stream its output.
      description: |
        Ensures the sandbox is running, then executes `argv` inside it. The
        response is a stream of newline-delimited JSON objects: zero or more
        `output` chunks followed by exactly one `exit` object. Output beyond
        `max_output_bytes` is truncated and reported in the `exit` object,
        with the workspace's size and quota, measured after the command
        (SBX-019).
      x-requirements: [AGT-011, SBX-001, SBX-011, SBX-019]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: The command was started; its output follows.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExecOutputChunk"
                  - $ref: "#/components/schemas/ExecExit"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/size:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: workspaceSize
      summary: The workspace's size and quota (SBX-019).
      x-requirements: [SBX-014, SBX-019]
      responses:
        "200":
          description: The workspace's size.
          content:
            application/json:
              schema:
                type: object
                required: [bytes, quota_bytes]
                properties:
                  bytes: { type: integer, minimum: 0 }
                  quota_bytes: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/entries:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/Path"
    get:
      operationId: listFolder
      summary: The entries of a folder of the workspace; links are listed, not followed.
      x-requirements: [SBX-014]
      responses:
        "200":
          description: The folder's entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteEntry
      summary: Delete a file, a link (not what it points to), or a folder with its contents.
      x-requirements: [SBX-014]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/files:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/Path"
    get:
      operationId: readFile
      summary: Stream a regular file of the workspace; a link or a folder is not read.
      x-requirements: [SBX-014]
      responses:
        "200":
          description: The file's content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: writeFile
      summary: Stream a new file into the workspace, complete or not at all.
      description: |
        `Content-Length` is required. The content is written under a temporary
        name and renamed when complete; an interrupted write leaves nothing.
        Missing folders are created. A path that exists is refused with `409`,
        and content that would take the workspace over its quota with `413`
        (SBX-014, SBX-019).
      x-requirements: [SBX-014, SBX-019]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The file, written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/archive:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/Path"
    get:
      operationId: zipFolder
      summary: Stream a folder of the workspace as a zip archive, links left out.
      x-requirements: [SBX-014]
      responses:
        "200":
          description: The folder, zipped.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/folders:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createFolder
      summary: Create a folder and the folders above it that are missing.
      x-requirements: [SBX-014]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: { type: string, minLength: 1 }
      responses:
        "201":
          description: The folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/move:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: moveEntry
      summary: Rename or move a file, link or folder within the workspace; an existing destination is refused.
      x-requirements: [SBX-014]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              additionalProperties: false
              properties:
                from: { type: string, minLength: 1 }
                to: { type: string, minLength: 1 }
      responses:
        "200":
          description: The entry at its new path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/stop:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: stopSandbox
      summary: Stop the conversation's sandbox and remove its container, keeping its workspace.
      x-requirements: [SBX-001, SBX-018]
      responses:
        "204": { description: "Stopped, or was not running." }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/workspace:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: exportWorkspace
      summary: Stream the conversation's workspace as a tar archive, for backups.
      description: |
        Regular files, directories and symbolic links, with their modes,
        relative to the workspace root. A conversation without a workspace yields an
        empty archive (SBX-020, ADR-0077).
      x-requirements: [SBX-020]
      responses:
        "200":
          description: The workspace.
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: importWorkspace
      summary: Replace the conversation's workspace with a tar archive, for restores.
      description: |
        Stops the conversation's sandbox, empties the workspace, and unpacks the
        archive into it, running nothing from it. An entry with an absolute
        path, a `..` segment, a link that leaves the workspace, or a type
        other than a regular file, a directory or a symbolic link refuses the
        whole archive with `422`, leaving the workspace empty (SBX-020).
      x-requirements: [SBX-020]
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        "204": { description: The workspace was replaced. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteWorkspace
      summary: Stop the conversation's sandbox and delete its workspace, when the conversation is deleted.
      x-requirements: [SBX-010]
      responses:
        "204": { description: "Deleted, or there was none." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /sandboxes/{tenant_id}/{user_id}/{conversation_id}/workspace/copy:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: copyWorkspace
      summary: Replace the conversation's workspace with a copy of another conversation's of the same user, for forks.
      description: |
        The source is another conversation of the same tenant and user; its
        workspace is copied as it is, and its sandbox keeps running (SBX-010,
        CNV-005, ADR-0078). A source without a workspace leaves this one empty.
      x-requirements: [SBX-010, CNV-005]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_conversation_id]
              additionalProperties: false
              properties:
                from_conversation_id: { type: string, format: uuid }
      responses:
        "204": { description: The workspace was copied. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    controlPlaneSecret:
      type: http
      scheme: bearer
      description: Secret shared between the control plane and the driver (ADR-0022).

  parameters:
    Path:
      name: path
      in: query
      required: true
      description: |
        Relative to the workspace's root; empty for the root where a folder is
        meant. Absolute paths, `..` segments and paths through a link are
        refused with `422` (SBX-014, T-34). The operations of this group start
        the conversation's sandbox if it is not running, and remove it again
        when they are done, so that none outlives them (SBX-018, ADR-0079).
      schema: { type: string }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      description: The conversation whose sandbox and workspace are meant (SBX-001, ADR-0078).
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: Missing or wrong control plane secret.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such file in the workspace.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The path exists already.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The file exceeds the configured size limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Isolation is not verified; the driver refuses to run sandboxes (fail closed).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - driver.unauthenticated
            - driver.validation_failed
            - driver.not_found
            - driver.too_large
            - driver.isolation_unavailable
            - driver.runtime_too_old
            - driver.egress_rules_missing
            - driver.internal_error

    Check:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: string }

    Health:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        runtime_version: { type: string, description: "e.g. release-20261026.0" }
        checks:
          type: object
          required: [platform, isolation_runtime, runtime_version, egress_table, canary]
          properties:
            platform:
              $ref: "#/components/schemas/Check"
              description: Docker runs on Linux, on x86_64 or aarch64 (OPS-002, ADR-0054).
            isolation_runtime: { $ref: "#/components/schemas/Check" }
            runtime_version: { $ref: "#/components/schemas/Check" }
            egress_table: { $ref: "#/components/schemas/Check" }
            canary: { $ref: "#/components/schemas/Check" }

    Entry:
      type: object
      required: [name, path, type, size, modified]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, folder, link] }
        size: { type: integer, minimum: 0 }
        modified: { type: string, format: date-time }

    Sandbox:
      type: object
      required: [state, started_at, working_dir]
      properties:
        state:
          type: string
          enum: [running]
        started_at: { type: string, format: date-time }
        working_dir:
          type: string
          description: The directory commands start in, the scratch folder `/scratch`, outside the workspace (SBX-018).

    ExecRequest:
      type: object
      description: Exactly one of `argv` and `shell_command` is required.
      additionalProperties: false
      oneOf:
        - required: [argv]
        - required: [shell_command]
      properties:
        argv:
          type: array
          minItems: 1
          items: { type: string }
          description: Program and arguments, executed without a shell.
        shell_command:
          type: string
          minLength: 1
          description: A command line interpreted by the sandbox's POSIX shell.
        env:
          type: object
          additionalProperties: { type: string }
          description: Extra environment variables for this command. Never used to pass credentials (SBX-008).
        workdir:
          type: string
          description: Working directory inside the sandbox; defaults to the workspace root.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Capped by the instance's configured maximum (SBX-011).
        max_output_bytes:
          type: integer
          minimum: 1
          description: Capped by the instance's configured maximum.

    ExecOutputChunk:
      type: object
      required: [kind, stream, data]
      additionalProperties: false
      properties:
        kind: { type: string, const: output }
        stream: { type: string, enum: [stdout, stderr] }
        data: { type: string, description: "UTF-8 text; invalid bytes are replaced." }

    ExecExit:
      type: object
      required: [kind, exit_code, timed_out, truncated, duration_ms, workspace_bytes, workspace_quota_bytes]
      additionalProperties: false
      properties:
        kind: { type: string, const: exit }
        workspace_bytes:
          type: integer
          minimum: 0
          description: The workspace's size after the command (SBX-019).
        workspace_quota_bytes:
          type: integer
          minimum: 1
        exit_code:
          type: [integer, "null"]
          description: Null when the command was killed.
        timed_out: { type: boolean }
        truncated: { type: boolean }
        duration_ms: { type: integer, minimum: 0 }
