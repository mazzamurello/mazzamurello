openapi: 3.1.0
info:
  title: Mazzamurello public API
  version: 0.8.0-draft
  summary: The single public HTTP API used by every Mazzamurello client (API-001).
  description: |
    Contract for phase 0. Requirements are referenced in `x-requirements`.

    Conventions:
    - All identifiers are UUIDs (version 7, time-ordered).
    - All timestamps are RFC 3339 in UTC.
    - Authentication uses opaque device session tokens (ADR-0025). In phase 0
      clients send them as `Authorization: Bearer <token>`; the cookie
      transport arrives with the web client in phase 1 (AUTH-005).
    - Errors are RFC 9457 problem details with a stable `code` (API-007).
    - Resources of other users or other tenants are reported as
      `not_found`, never as `forbidden`, so their existence is not disclosed
      (TEN-006).
    - Lists are paginated with opaque cursors.
    - Runs stream AG-UI 1.0 events over Server-Sent Events (ADR-0032). Each
      SSE message has `id` = sequence number (from 1 within a run), `event` =
      the AG-UI event type and `data` = the JSON-encoded AG-UI event.
      Resuming with `GET /runs/{run_id}/events` is a Mazzamurello extension;
      standard AG-UI clients ignore `id`.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: /v1

security:
  - deviceSession: []
  - sessionCookie: []

tags:
  - name: auth
  - name: administration
  - name: models
  - name: conversations
  - name: folders
  - name: runs
  - name: health

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Create a device session.
      description: |
        The username is matched ignoring case (ADR-0047). A disabled account
        is answered like a wrong password, and the attempt counts as failed.
        Attempts over the rate limits are refused with `429` and a
        `Retry-After` header, whether or not the password was right. With
        `session_delivery` set to `cookie`, the session is set as the
        `mzm_session` cookie and the token is not in the body (ADR-0067).
      x-requirements: [AUTH-001, AUTH-004, AUTH-005, AUTH-006]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Session created. The token is returned only once, in the body or as a cookie.
          headers:
            Set-Cookie:
              description: The `mzm_session` cookie, when `session_delivery` is `cookie`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current device session.
      description: The session's cookie, if any, is cleared too.
      x-requirements: [AUTH-004, AUTH-005]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The authenticated user.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: List the user's device sessions.
      x-requirements: [AUTH-004]
      responses:
        "200":
          description: Active sessions of the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: Revoke one of the user's device sessions.
      x-requirements: [AUTH-004]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /instance/tenants:
    post:
      tags: [administration]
      operationId: createTenant
      summary: Create a tenant with its first tenant admin (instance admin only).
      x-requirements: [TEN-001, AUTH-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [administration]
      operationId: listTenants
      summary: List tenants (instance admin only).
      x-requirements: [TEN-001]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenant/users:
    post:
      tags: [administration]
      operationId: createUser
      summary: Create a user in the current tenant (tenant admin only).
      x-requirements: [AUTH-001, AUTH-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [administration]
      operationId: listUsers
      summary: List the users of the current tenant.
      x-requirements: [TEN-001]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /tenant/connections:
    post:
      tags: [models]
      operationId: createConnection
      summary: Add a connection to the current tenant (tenant admin only).
      description: |
        The connection is tested first (MOD-013); when the test fails it is
        not saved, and the answer is `connection.test_failed` with the test's
        result. Only a user who is also the instance admin may use a private
        address or `http` (MOD-009, ADR-0069).
      x-requirements: [MOD-008, MOD-002, MOD-009, MOD-013, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectionRequest" }
      responses:
        "201":
          description: Connection added; its models are listed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ConnectionRefused" }
    get:
      tags: [models]
      operationId: listConnections
      summary: List the connections of the current tenant (tenant admin only).
      x-requirements: [MOD-008, MOD-002, TEN-006]
      responses:
        "200":
          description: Every connection of the tenant, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenant/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    patch:
      tags: [models]
      operationId: updateConnection
      summary: Change a connection (tenant admin only).
      description: |
        A new address or API key is tested first, as when adding a
        connection. A new address set by a user who is not the instance admin
        must be public (MOD-009).
      x-requirements: [MOD-008, MOD-002, MOD-009, MOD-013, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConnectionRequest" }
      responses:
        "200":
          description: The updated connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ConnectionRefused" }
    delete:
      tags: [models]
      operationId: deleteConnection
      summary: Remove a connection (tenant admin only).
      description: |
        Its models are no longer offered: conversations that use one of
        them fail with `model.unavailable` until their user chooses another
        model, and removing the connection of the default model leaves the
        tenant without one (MOD-012).
      x-requirements: [MOD-008, TEN-006]
      responses:
        "204": { description: Connection removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/connections/{connection_id}/test:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [models]
      operationId: testConnection
      summary: Test a saved connection and refresh its models (tenant admin only).
      x-requirements: [MOD-009, MOD-011, MOD-013, TEN-006]
      responses:
        "200":
          description: The result of the test, passed or failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /tenant/connection-tests:
    post:
      tags: [models]
      operationId: testNewConnection
      summary: Test a connection before adding it (tenant admin only).
      description: Nothing is saved. Tests are limited to 20 a minute per tenant (T-31).
      x-requirements: [MOD-009, MOD-013]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectionRequest" }
      responses:
        "200":
          description: The result of the test, passed or failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /tenant/default-model:
    put:
      tags: [models]
      operationId: setDefaultModel
      summary: Choose the model new conversations start with (tenant admin only).
      x-requirements: [MOD-008, MOD-012, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelChoice" }
      responses:
        "200":
          description: The default model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelChoice" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Every model the connections of the user's tenant offer.
      description: |
        For every user of the tenant. Grouped by connection, connections by
        name; within one, in the provider's order: for OpenRouter, most used
        in the past week first (MOD-011). Lists older than a day are
        refreshed in the background (ADR-0069).
      x-requirements: [MOD-010, MOD-011, MOD-012, MOD-014, UX-015, TEN-006]
      responses:
        "200":
          description: The models of the tenant.
          content:
            application/json:
              schema:
                type: object
                required: [items, default]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ModelOption" }
                  default:
                    description: The tenant's default model, or `null` when it has none.
                    oneOf: [{ $ref: "#/components/schemas/ModelChoice" }, { type: "null" }]
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /conversations:
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create a conversation.
      x-requirements: [API-003]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: Conversation created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [conversations]
      operationId: listConversations
      summary: List the user's conversations, most recently updated first.
      x-requirements: [API-003, TEN-006]
      parameters:
        - name: archived
          in: query
          description: Return archived conversations instead of active ones.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: getConversation
      x-requirements: [API-003, TEN-006]
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [conversations]
      operationId: updateConversation
      summary: Rename, archive or unarchive a conversation.
      x-requirements: [API-003, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: The updated conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [conversations]
      operationId: deleteConversation
      summary: Permanently delete a conversation, its messages, runs and run events.
      x-requirements: [API-003, TEN-006]
      responses:
        "204": { description: Conversation deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunInProgress" }

  /conversations/{conversation_id}/rewind:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [conversations]
      operationId: rewindConversation
      summary: Rewind to an earlier turn, deleting what followed it.
      description: |
        `run_id` names the run that becomes the last of the conversation; it
        must belong to this conversation. Every run after it is deleted, with
        its messages, run events and durable workflow; `null` deletes every
        run, so that the next run is the first turn again (CNV-004,
        ADR-0068). Workspace files are not changed. Entries of the cost
        ledger are kept, detached from the deleted runs. Refused with
        `run.interrupt_pending` while an interrupt is pending, and with
        `run.in_progress` while a run is queued or running.
      x-requirements: [CNV-004, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewindRequest" }
      responses:
        "200":
          description: The conversation, rewound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunInProgress" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /conversations/{conversation_id}/fork:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [conversations]
      operationId: forkConversation
      summary: Start a new conversation from a copy of this one up to a run.
      description: |
        The fork holds copies of the runs and messages from the first run to
        `run_id`, under new identifiers, in the same folder, with the same
        title and model; it records where it came from. Ledger entries are
        not copied (CNV-005, ADR-0073). Refused with `run.in_progress` while
        a run of the conversation is queued or running.
      x-requirements: [CNV-005, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForkRequest" }
      responses:
        "201":
          description: The fork.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunInProgress" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /conversation-list:
    get:
      tags: [conversations]
      operationId: getConversationList
      summary: The user's conversations and folders, as one list.
      description: |
        Pinned entries first, then the others; within each group, newest
        first by the most recent message, a folder by that of its
        conversations, or by its creation while it holds none. A folder entry
        carries its conversations, in the same order. Archived conversations
        are left out (CNV-007, CNV-008).
      x-requirements: [CNV-007, CNV-008, TEN-006]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationListPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /folders:
    post:
      tags: [folders]
      operationId: createFolder
      summary: Create a folder.
      x-requirements: [CNV-007]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFolderRequest" }
      responses:
        "201":
          description: Folder created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /folders/{folder_id}:
    parameters:
      - $ref: "#/components/parameters/FolderId"
    patch:
      tags: [folders]
      operationId: updateFolder
      summary: Rename, pin, unpin, collapse or expand a folder.
      x-requirements: [CNV-007, CNV-008, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFolderRequest" }
      responses:
        "200":
          description: The updated folder.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [folders]
      operationId: deleteFolder
      summary: Delete a folder; its conversations move out of it.
      x-requirements: [CNV-007, TEN-006]
      responses:
        "204": { description: Folder deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      tags: [conversations]
      operationId: search
      summary: Search the titles and message text of the user's conversations.
      description: |
        Full-text search without regard to language (ADR-0073), ranked by
        relevance, then by recency. Tool calls and their results are not
        searched (CNV-009).
      x-requirements: [CNV-009, TEN-003, TEN-006]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: The matching conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/usage:
    get:
      tags: [conversations]
      operationId: getUsage
      summary: The user's spend over the last 24 hours and the last 30 days.
      x-requirements: [MOD-007, UX-008]
      responses:
        "200":
          description: Totals from the cost ledger (ADR-0042, ADR-0073).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: listMessages
      summary: The history of the conversation, oldest first, as AG-UI messages.
      description: |
        A projection of the stored Pydantic AI messages (ADR-0031), in the AG-UI
        message format, including tool calls and tool results, from the first
        run to the active run (ADR-0037, ADR-0068). Each page also describes
        the runs of its messages.
      x-requirements: [API-003, TEN-006]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversation_id}/runs:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [runs]
      operationId: startRun
      summary: Start a run (AG-UI compatible) and stream its events.
      description: |
        Accepts an AG-UI `RunAgentInput`. Only the last user message, the
        `resume` answers and `parentRunId` are used; history is managed by the
        server (ADR-0031). The run continues the active run and becomes the
        active run; a `parentRunId` other than the active run is refused with
        `resource.conflict`, since a conversation never branches (ADR-0068). The run executes in a worker and continues if the client
        disconnects (AGT-009); reconnect with `GET /runs/{run_id}/events`.
        A `runId` that already exists in this conversation returns that run's
        stream from the beginning, so a retried request does not start a
        second run. Errors detected before the run starts are returned as
        HTTP problems; errors after it starts arrive as `RUN_ERROR`. A run
        whose workflow cannot be queued fails at once with `internal.error`,
        so the conversation accepts new runs.
      x-requirements: [AGT-009, AGT-010, API-003, API-004, CNV-002, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunAgentInput" }
      responses:
        "200":
          description: The run's AG-UI events, as Server-Sent Events.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages whose `data` field is a JSON-encoded AG-UI event.
              x-event-schema: { $ref: "#/components/schemas/AgUiEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A run is in progress (`run.in_progress`), an interrupt is pending
            (`run.interrupt_pending`), `parentRunId` is not the active run
            (`resource.conflict`), or the conversation's model is not offered
            by a connection of the tenant, or it has none and the tenant has no
            default model (`model.unavailable`, MOD-012).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRun
      x-requirements: [AGT-009, AGT-010, TEN-006]
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Stop a queued or running run.
      description: |
        No further model or tool calls start; messages produced so far are
        kept, and the run ends with status `cancelled` (CNV-003, ADR-0037).
        Its event stream ends with `RUN_ERROR` carrying the code
        `run.cancelled`. A queued run whose workflow is gone is cancelled
        too, so a conversation is never stuck behind it. Cancelling a run that
        has already ended returns it unchanged.
      x-requirements: [CNV-003, AGT-010, TEN-006]
      responses:
        "200":
          description: The run, cancelled or already ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Resume the events of a run (Mazzamurello extension to AG-UI).
      description: |
        Sends every event with a sequence number greater than the one given in
        `Last-Event-ID` (or `after`), then follows new events until the run
        ends. The stream closes after `RUN_FINISHED` (including a finish with
        an `interrupt` outcome) or `RUN_ERROR` (API-004, ADR-0032).
      x-requirements: [API-004, AGT-009, CNV-015, TEN-006]
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last sequence number received, sent by SSE clients on reconnection.
          schema: { type: integer, minimum: 0 }
        - name: after
          in: query
          description: Same as `Last-Event-ID`, for clients that cannot set headers.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The run's AG-UI events after the given sequence number.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages whose `data` field is a JSON-encoded AG-UI event.
              x-event-schema: { $ref: "#/components/schemas/AgUiEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Readiness of the instance.
      description: |
        Anonymous callers receive only `status`. Instance admins also receive
        the individual checks (OPS-002). The status is `unavailable` when the
        database is unreachable or the sandbox driver refuses sandboxes, then
        the answer is `503`; `degraded` when no tenant has a default model
        (ADR-0069); `ok` otherwise (ADR-0054).
      x-requirements: [OPS-002, SBX-003, SBX-015, SBX-017]
      security: [{}, { deviceSession: [] }]
      responses:
        "200":
          description: The instance is ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The instance is not ready; sandboxes are refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

components:
  securitySchemes:
    deviceSession:
      type: http
      scheme: bearer
      description: Opaque device session token (ADR-0025, AUTH-004).
    sessionCookie:
      type: apiKey
      in: cookie
      name: mzm_session
      description: |
        The same session token, in an `HttpOnly`, `Secure`, `SameSite=Lax`
        cookie set by `login` for the web app (ADR-0025, ADR-0067). A request
        authenticated by this cookie with a method other than `GET`, `HEAD`
        or `OPTIONS` must carry the header `X-Mazzamurello-Request` with any
        value; without it the request is unauthenticated (AUTH-005).

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    FolderId:
      name: folder_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Unauthenticated:
      description: Missing, invalid, expired or revoked session token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Unauthenticated", status: 401, code: "auth.unauthenticated" }
    InvalidCredentials:
      description: Wrong username or password.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Invalid credentials", status: 401, code: "auth.invalid_credentials" }
    RateLimited:
      description: Too many attempts; retry after the indicated delay.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Too many attempts", status: 429, code: "auth.rate_limited" }
    Forbidden:
      description: The user's role does not allow this operation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Forbidden", status: 403, code: "permission.denied" }
    NotFound:
      description: The resource does not exist or belongs to someone else.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Not found", status: 404, code: "resource.not_found" }
    Conflict:
      description: A resource with the same unique name already exists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Conflict", status: 409, code: "resource.conflict" }
    ConnectionRefused:
      description: |
        The request is invalid (`request.validation_failed`), or the
        connection failed its test (`connection.test_failed`, MOD-013), whose
        result is in `test`.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  test: { $ref: "#/components/schemas/ConnectionTest" }
    RunInProgress:
      description: |
        A run is in progress in this conversation (`run.in_progress`), or an
        interrupt is pending and the request does not answer it
        (`run.interrupt_pending`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Run in progress", status: 409, code: "run.in_progress" }
    ValidationFailed:
      description: The request body or parameters are invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Validation failed", status: 422, code: "request.validation_failed" }

  schemas:
    Id:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    ErrorCode:
      type: string
      description: Stable, machine-readable error code (API-007).
      enum:
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.rate_limited
        - permission.denied
        - resource.not_found
        - resource.conflict
        - request.validation_failed
        - run.in_progress
        - run.interrupt_pending
        - run.cancelled
        - approval.invalid
        - run.worker_lost
        - run.timeout
        - model.unavailable
        - model.request_failed
        - connection.test_failed
        - sandbox.unavailable
        - sandbox.command_failed
        - internal.error

    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        errors:
          type: array
          description: Field-level details for `request.validation_failed`.
          items:
            type: object
            required: [location, code]
            properties:
              location: { type: string, description: "JSON pointer or parameter name." }
              code: { type: string }

    LoginRequest:
      type: object
      required: [username, password, device_name]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        device_name: { type: string, minLength: 1, maxLength: 100 }
        session_delivery:
          type: string
          enum: [token, cookie]
          default: token
          description: "`cookie` for browsers: the token is set as an `HttpOnly` cookie instead of returned (ADR-0067)."

    LoginResponse:
      type: object
      required: [session, user]
      properties:
        token:
          type: string
          description: Opaque session token, absent when it was set as a cookie. Shown only once; store it securely.
        session: { $ref: "#/components/schemas/DeviceSession" }
        user: { $ref: "#/components/schemas/User" }

    DeviceSession:
      type: object
      required: [id, device_name, created_at, last_used_at, expires_at, current]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        device_name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          description: 90 days after the last use (ADR-0049).
          allOf:
            - $ref: "#/components/schemas/Timestamp"
        current: { type: boolean, description: "True for the session making the request." }

    Role:
      type: string
      enum: [member, tenant_admin]

    User:
      type: object
      required: [id, tenant_id, username, display_name, role, instance_admin, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        tenant_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        instance_admin: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: [string, "null"] }

    CreateUserRequest:
      type: object
      required: [username, display_name, password, role]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
          description: Unique across the instance.
        display_name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
        role: { $ref: "#/components/schemas/Role" }

    Tenant:
      type: object
      required: [id, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    TenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_cursor: { type: [string, "null"] }

    CreateTenantRequest:
      type: object
      required: [name, admin]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        admin:
          description: The tenant's first tenant admin; `role` must be `tenant_admin`.
          allOf:
            - $ref: "#/components/schemas/CreateUserRequest"

    Decimal:
      type: string
      pattern: "^[0-9]{1,10}(\\.[0-9]{1,10})?$"
      description: A non-negative decimal number, as a string so that no precision is lost.
    ModelPrices:
      type: object
      description: Prices per million tokens, in one currency (ADR-0042).
      required: [input, output, currency]
      additionalProperties: false
      properties:
        input: { $ref: "#/components/schemas/Decimal" }
        cached_input: { $ref: "#/components/schemas/Decimal" }
        output: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217 code." }
    ConnectionKind:
      type: string
      description: |
        `openrouter` for OpenRouter; `openai` for a server with an
        OpenAI-compatible API (ADR-0057, ADR-0069).
      enum: [openrouter, openai]
    Location:
      type: string
      description: Where inference runs (MOD-010, ADR-0066).
      enum: [local, remote]
    Connection:
      type: object
      description: |
        A household's access to one provider (ADR-0069). The API key is never
        returned; `has_api_key` says whether one is set. `private_network` is
        true when the address was set by a user who is the instance admin,
        which allows a private address (MOD-009).
      required: [id, name, kind, base_url, location, has_api_key, private_network, context_window, model_count, models_refreshed_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ConnectionKind" }
        base_url: { type: string, format: uri }
        location: { $ref: "#/components/schemas/Location" }
        has_api_key: { type: boolean }
        private_network: { type: boolean }
        context_window:
          type: [integer, "null"]
          description: For a connection to your own server, the context window of its models, in tokens; `null` for OpenRouter, which lists each model's (ADR-0073).
        model_count: { type: integer, minimum: 0 }
        models_refreshed_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    CreateConnectionRequest:
      type: object
      description: |
        For `openrouter`, `base_url` defaults to `https://openrouter.ai/api/v1`
        and `location` is `remote`; an `api_key` is required. For `openai`,
        `base_url` and `location` are required.
      required: [name, kind]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: "#/components/schemas/ConnectionKind" }
        base_url: { type: string, format: uri, maxLength: 2000, description: "Address of the API, such as `http://192.168.1.10:11434/v1`." }
        location: { $ref: "#/components/schemas/Location" }
        context_window: { type: integer, minimum: 512, maximum: 10000000, description: "For `openai` only; 8192 when not given." }
        api_key: { type: string, minLength: 1, maxLength: 1000, writeOnly: true }
    UpdateConnectionRequest:
      type: object
      description: Fields to change. `api_key` set to `null` removes it.
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        base_url: { type: string, format: uri, maxLength: 2000 }
        location: { $ref: "#/components/schemas/Location" }
        context_window: { type: integer, minimum: 512, maximum: 10000000, description: "For `openai` only; 8192 when not given." }
        api_key: { oneOf: [{ type: string, minLength: 1, maxLength: 1000 }, { type: "null" }], writeOnly: true }
    ConnectionTestStep:
      type: object
      required: [step, outcome, duration_ms, detail]
      properties:
        step:
          type: string
          description: |
            `resolve`: find the address of the host; `connect`: open a
            connection; `tls`: secure it, for `https`; `authenticate`: check
            the key, for OpenRouter; `list_models`: read the model list.
          enum: [resolve, connect, tls, authenticate, list_models]
        outcome: { type: string, enum: [passed, failed, skipped] }
        duration_ms: { type: [integer, "null"], minimum: 0, description: "Null for a skipped step." }
        detail: { type: string, maxLength: 500, description: "Such as the address found, or `GET /v1/models → 404 Not Found`." }
    ConnectionTest:
      type: object
      description: |
        The result of a connection test, step by step (MOD-013). Steps after a
        failure are skipped. `technical_detail` holds the low-level error or
        up to 500 characters of the response; it never contains the API key.
      required: [passed, steps, reason, http_status, technical_detail, model_count]
      properties:
        passed: { type: boolean }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ConnectionTestStep" }
        reason:
          description: Why the test failed; `null` when it passed.
          oneOf:
            - type: string
              enum: [name_not_found, connection_refused, timeout, tls_untrusted, address_not_allowed, http_error, unauthorized, not_a_model_server]
            - type: "null"
        http_status: { type: [integer, "null"], description: "The status of a failed HTTP answer." }
        technical_detail: { type: [string, "null"], maxLength: 2000 }
        model_count: { type: [integer, "null"], minimum: 0, description: "Models found, when the test passed." }
    ModelChoice:
      type: object
      description: A model, named by its connection and the provider's name for it (ADR-0069).
      required: [connection_id, model]
      additionalProperties: false
      properties:
        connection_id: { $ref: "#/components/schemas/Id" }
        model: { type: string, minLength: 1, maxLength: 200 }
    ModelOption:
      type: object
      description: One model a connection of the tenant offers (MOD-011, UX-015).
      required: [connection_id, connection_name, model, name, location, prices, context_window, tools]
      properties:
        connection_id: { $ref: "#/components/schemas/Id" }
        connection_name: { type: string }
        model: { type: string, description: "The provider's name for the model, such as `qwen3:8b`." }
        name: { type: string, description: "The name to show, such as `Qwen3 8B`." }
        location: { $ref: "#/components/schemas/Location" }
        prices:
          description: Prices per million tokens when the model is paid per token and they are known, else `null`.
          oneOf: [{ $ref: "#/components/schemas/ModelPrices" }, { type: "null" }]
        context_window: { type: [integer, "null"], minimum: 1, description: "From the provider, or the connection's for your own server." }
        tools:
          type: [boolean, "null"]
          description: Whether the model can call tools; `null` when the provider does not say. A model that cannot runs without tools (MOD-014).

    Conversation:
      type: object
      required: [id, title, archived, active_run_id, model, folder_id, pinned, forked_from, cost, last_message_at, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title:
          type: string
          description: Empty while the conversation is untitled; clients show their own placeholder (ADR-0052).
        archived: { type: boolean }
        active_run_id:
          description: Last run of the active path (ADR-0037); null before the first run.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        model:
          description: |
            The model its next run uses (MOD-012): the tenant's default model
            when the conversation was created, or the one its user chose;
            `null` when the tenant had no default model then.
          oneOf: [{ $ref: "#/components/schemas/ModelChoice" }, { type: "null" }]
        folder_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        pinned: { type: boolean }
        forked_from:
          description: The conversation and run this one was forked from; the conversation is `null` once deleted, and the run is the original run's identifier even then (CNV-005).
          oneOf:
            - type: object
              required: [conversation_id, run_id]
              properties:
                conversation_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
                run_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
            - type: "null"
        cost:
          description: What the conversation's model requests cost, per currency (MOD-007).
          type: array
          items: { $ref: "#/components/schemas/Money" }
        last_message_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        next_cursor: { type: [string, "null"] }

    CreateConversationRequest:
      type: object
      description: Without `model`, the conversation starts with the tenant's default model.
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        model: { $ref: "#/components/schemas/ModelChoice" }

    UpdateConversationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        archived: { type: boolean }
        model:
          allOf: [{ $ref: "#/components/schemas/ModelChoice" }]
          description: A model offered by a connection of the tenant; used from the next run (MOD-012).
        folder_id:
          description: A folder of the user, or `null` to move the conversation out of its folder (CNV-007).
          oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }]
        pinned: { type: boolean }

    ForkRequest:
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        run_id:
          $ref: "#/components/schemas/Id"
          description: The last run the fork copies.

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }

    Usage:
      type: object
      description: Spend per currency; requests whose price is unknown are counted, not priced (ADR-0042).
      required: [last_24_hours, last_30_days, unpriced_requests]
      properties:
        last_24_hours: { type: array, items: { $ref: "#/components/schemas/Money" } }
        last_30_days: { type: array, items: { $ref: "#/components/schemas/Money" } }
        unpriced_requests: { type: integer, minimum: 0, description: "Requests in the last 30 days whose price is unknown." }

    Folder:
      type: object
      required: [id, name, pinned, collapsed, last_message_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        pinned: { type: boolean }
        collapsed: { type: boolean, description: "Kept for the user on every device (CNV-008)." }
        last_message_at:
          description: That of its most recent conversation; `null` when it holds none.
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        created_at: { $ref: "#/components/schemas/Timestamp" }

    CreateFolderRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    UpdateFolderRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        pinned: { type: boolean }
        collapsed: { type: boolean }

    ConversationListEntry:
      oneOf:
        - type: object
          required: [kind, folder, conversations]
          properties:
            kind: { const: folder }
            folder: { $ref: "#/components/schemas/Folder" }
            conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        - type: object
          required: [kind, conversation]
          properties:
            kind: { const: conversation }
            conversation: { $ref: "#/components/schemas/Conversation" }

    ConversationListPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ConversationListEntry" } }
        next_cursor: { type: [string, "null"] }

    SearchResult:
      type: object
      required: [conversation_id, title, snippet, last_message_at]
      properties:
        conversation_id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        snippet:
          type: string
          maxLength: 300
          description: Plain text around the first match, from a message or else the title.
        last_message_at: { $ref: "#/components/schemas/Timestamp" }

    RewindRequest:
      type: object
      required: [run_id]
      additionalProperties: false
      properties:
        run_id:
          description: The run that becomes the last of the conversation, or `null` to delete every run.
          oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }]

    AgUiMessage:
      type: object
      description: |
        A message in the AG-UI 1.0 format (roles such as `user`, `assistant`,
        `tool`, `reasoning`), projected from the stored Pydantic AI messages.
        See https://docs.ag-ui.com/ for the full definition.
      required: [id, role]
      additionalProperties: true
      properties:
        id:
          type: string
          description: |
            Stable: derived from the run that produced the message and its
            position in that run, so a message has the same ID on every page.
            It is neither the
            ID a client sent in its run input nor the one in the run's events;
            clients reload history after a run.
        role: { type: string }
        content: {}

    MessagePage:
      type: object
      required: [items, runs]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgUiMessage" }
        runs:
          type: array
          description: The runs that produced the messages of this page, in order.
          items: { $ref: "#/components/schemas/PathRun" }
        next_cursor: { type: [string, "null"] }

    PathRun:
      type: object
      description: |
        One run of the conversation (ADR-0037). A client rewinds to before a
        user message by naming the parent of the run that holds it
        (ADR-0068).
      required: [run_id, parent_run_id, kind, message_ids, cost]
      properties:
        run_id: { $ref: "#/components/schemas/Id" }
        parent_run_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        kind: { $ref: "#/components/schemas/RunKind" }
        message_ids:
          type: array
          description: IDs of the AG-UI messages, in `items`, that this run produced.
          items: { type: string }
        cost:
          description: What the run's model requests cost, per currency, which clients show beside its answer (UX-008).
          type: array
          items: { $ref: "#/components/schemas/Money" }

    RunAgentInput:
      type: object
      description: |
        The AG-UI 1.0 run input. Fields not listed here are accepted and
        ignored; in particular, client-provided history, tools, context and
        state are never used (ADR-0031).
      required: [threadId, runId, messages]
      additionalProperties: true
      properties:
        threadId:
          $ref: "#/components/schemas/Id"
          description: Must equal the conversation ID in the path.
        runId:
          $ref: "#/components/schemas/Id"
          description: Chosen by the client; becomes the run ID.
        parentRunId:
          $ref: "#/components/schemas/Id"
          description: |
            The run to continue. If given, it must be the active run
            (ADR-0068); never send `null`. Ignored when `resume` is given: a
            resume always continues the interrupted run.
        messages:
          type: array
          description: Only the last message is used, and it must have role `user`, unless `resume` is given.
          items: { $ref: "#/components/schemas/AgUiMessage" }
        resume:
          type: array
          description: Answers to the pending interrupts of the conversation (ADR-0033).
          items:
            type: object
            required: [interruptId, status]
            additionalProperties: false
            properties:
              interruptId: { type: string }
              status: { type: string, enum: [resolved, cancelled] }
              payload:
                description: 'For approvals, `{"approved": true|false}`.'

    ModelRef:
      type: object
      description: The connection, when it still exists, and the provider and model that answered (MOD-005).
      required: [connection_id, provider, model]
      properties:
        connection_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        provider: { type: string }
        model: { type: string }

    RunStatus:
      type: string
      enum: [queued, running, interrupted, completed, failed, cancelled]

    RunKind:
      type: string
      description: "`message` starts a turn; `resume` answers an interrupt (ADR-0033)."
      enum: [message, resume]

    Run:
      type: object
      required: [id, conversation_id, parent_run_id, kind, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        conversation_id: { $ref: "#/components/schemas/Id" }
        parent_run_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        kind: { $ref: "#/components/schemas/RunKind" }
        status: { $ref: "#/components/schemas/RunStatus" }
        error_code:
          description: Set when `status` is `failed`.
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        model:
          description: Provider and model that answered (MOD-005).
          oneOf:
            - $ref: "#/components/schemas/ModelRef"
            - type: "null"
        last_event_seq:
          type: integer
          minimum: 0
          description: |
            The number of events the worker recorded for the run. After the
            worker restarts during a run it can be lower than the events in
            the run's stream, which is authoritative: read the stream to know
            them all.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        finished_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    AgUiEvent:
      type: object
      description: |
        An AG-UI 1.0 event (https://docs.ag-ui.com/). The types below are the
        ones Mazzamurello emits; clients must ignore unknown types. After each
        model response, a `CUSTOM` event named `mzm.usage` carries as `value`
        `{context_window, context_tokens, input_tokens, output_tokens, cost}`:
        the model's window and the tokens its context used, the run's tokens
        so far, and its cost so far as a `Money`, or `null` when unknown
        (MOD-007, ADR-0073). When a conversation's automatic title is stored
        during its first run, a `CUSTOM` event named `mzm.title` carries as
        `value` `{title}`, before the run finishes (CNV-006, ADR-0073).
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
            - RUN_STARTED
            - RUN_FINISHED
            - RUN_ERROR
            - STEP_STARTED
            - STEP_FINISHED
            - TEXT_MESSAGE_START
            - TEXT_MESSAGE_CONTENT
            - TEXT_MESSAGE_END
            - TOOL_CALL_START
            - TOOL_CALL_ARGS
            - TOOL_CALL_END
            - TOOL_CALL_RESULT
            - REASONING_START
            - REASONING_MESSAGE_START
            - REASONING_MESSAGE_CONTENT
            - REASONING_MESSAGE_END
            - REASONING_END
            - CUSTOM

    HealthStatus:
      type: string
      enum: [ok, degraded, unavailable]

    Health:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        checks:
          type: object
          description: Present only for instance admins.
          properties:
            database: { $ref: "#/components/schemas/HealthStatus" }
            platform: { $ref: "#/components/schemas/HealthStatus" }
            sandbox_driver: { $ref: "#/components/schemas/HealthStatus" }
            isolation_runtime: { $ref: "#/components/schemas/HealthStatus" }
            egress_table: { $ref: "#/components/schemas/HealthStatus" }
            model_gateway: { $ref: "#/components/schemas/HealthStatus" }
