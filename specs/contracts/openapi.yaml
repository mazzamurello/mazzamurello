openapi: 3.1.0
info:
  title: Mazzamurello public API
  version: 0.5.1-draft
  summary: The single public HTTP API used by every Mazzamurello client (API-001).
  description: |
    Contract for phase 0. Requirements are referenced in `x-requirements`.

    Conventions:
    - All identifiers are UUIDs (version 7, time-ordered).
    - All timestamps are RFC 3339 in UTC.
    - Authentication uses opaque device session tokens (ADR-0025). In phase 0
      clients send them as `Authorization: Bearer <token>`; the cookie
      transport arrives with the web client in phase 1 (AUTH-005).
    - Errors are RFC 9457 problem details with a stable `code` (API-007).
    - Resources of other users or other tenants are reported as
      `not_found`, never as `forbidden`, so their existence is not disclosed
      (TEN-006).
    - Lists are paginated with opaque cursors.
    - Runs stream AG-UI 1.0 events over Server-Sent Events (ADR-0032). Each
      SSE message has `id` = sequence number (from 1 within a run), `event` =
      the AG-UI event type and `data` = the JSON-encoded AG-UI event.
      Resuming with `GET /runs/{run_id}/events` is a Mazzamurello extension;
      standard AG-UI clients ignore `id`.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

servers:
  - url: /v1

security:
  - deviceSession: []

tags:
  - name: auth
  - name: administration
  - name: conversations
  - name: runs
  - name: health

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Create a device session.
      description: |
        The username is matched ignoring case (ADR-0047). A disabled account
        is answered like a wrong password, and the attempt counts as failed.
        Attempts over the rate limits are refused with `429` and a
        `Retry-After` header, whether or not the password was right.
      x-requirements: [AUTH-001, AUTH-004, AUTH-006]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Session created. The token is returned only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current device session.
      x-requirements: [AUTH-004]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The authenticated user.
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: List the user's device sessions.
      x-requirements: [AUTH-004]
      responses:
        "200":
          description: Active sessions of the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DeviceSession" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: Revoke one of the user's device sessions.
      x-requirements: [AUTH-004]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /instance/tenants:
    post:
      tags: [administration]
      operationId: createTenant
      summary: Create a tenant with its first tenant admin (instance admin only).
      x-requirements: [TEN-001, AUTH-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [administration]
      operationId: listTenants
      summary: List tenants (instance admin only).
      x-requirements: [TEN-001]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /instance/models:
    post:
      tags: [administration]
      operationId: createInstanceModel
      summary: Configure a model for the instance (instance admin only).
      x-requirements: [MOD-008, MOD-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateModelConfigurationRequest" }
      responses:
        "201":
          description: Model configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelConfiguration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [administration]
      operationId: listInstanceModels
      summary: List the model configurations of the instance (instance admin only).
      x-requirements: [MOD-008, MOD-002]
      responses:
        "200":
          description: Every model configuration of this scope, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ModelConfiguration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /instance/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    patch:
      tags: [administration]
      operationId: updateInstanceModel
      summary: Change a model configuration (instance admin only).
      x-requirements: [MOD-008, MOD-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModelConfigurationRequest" }
      responses:
        "200":
          description: The updated model configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelConfiguration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [administration]
      operationId: deleteInstanceModel
      summary: Remove a model configuration (instance admin only). Removing the default leaves the scope without one.
      x-requirements: [MOD-008, MOD-002]
      responses:
        "204": { description: Model configuration removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/users:
    post:
      tags: [administration]
      operationId: createUser
      summary: Create a user in the current tenant (tenant admin only).
      x-requirements: [AUTH-001, AUTH-002]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [administration]
      operationId: listUsers
      summary: List the users of the current tenant.
      x-requirements: [TEN-001]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /tenant/models:
    post:
      tags: [administration]
      operationId: createTenantModel
      summary: Configure a model for the current tenant (tenant admin only).
      x-requirements: [MOD-008, MOD-002, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateModelConfigurationRequest" }
      responses:
        "201":
          description: Model configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelConfiguration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [administration]
      operationId: listTenantModels
      summary: List the model configurations of the current tenant (tenant admin only).
      x-requirements: [MOD-008, MOD-002, TEN-006]
      responses:
        "200":
          description: Every model configuration of this scope, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ModelConfiguration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenant/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    patch:
      tags: [administration]
      operationId: updateTenantModel
      summary: Change a model configuration (tenant admin only).
      x-requirements: [MOD-008, MOD-002, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModelConfigurationRequest" }
      responses:
        "200":
          description: The updated model configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelConfiguration" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [administration]
      operationId: deleteTenantModel
      summary: Remove a model configuration (tenant admin only). Removing the default leaves the scope without one.
      x-requirements: [MOD-008, MOD-002, TEN-006]
      responses:
        "204": { description: Model configuration removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations:
    post:
      tags: [conversations]
      operationId: createConversation
      summary: Create a conversation.
      x-requirements: [API-003]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "201":
          description: Conversation created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [conversations]
      operationId: listConversations
      summary: List the user's conversations, most recently updated first.
      x-requirements: [API-003, TEN-006]
      parameters:
        - name: archived
          in: query
          description: Return archived conversations instead of active ones.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: getConversation
      x-requirements: [API-003, TEN-006]
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [conversations]
      operationId: updateConversation
      summary: Rename, archive or unarchive a conversation, or switch the version shown.
      description: |
        Setting `active_run_id` switches to another version (CNV-001) or
        rewinds to an earlier turn (CNV-004), as described in ADR-0037: the
        run must belong to this conversation; the active path becomes the
        path from the first run to that run. Workspace files are not
        changed. Refused with
        `run.interrupt_pending` while an interrupt is pending, and with
        `run.in_progress` while a run is queued or running.
      x-requirements: [API-003, CNV-001, CNV-004, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: The updated conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunInProgress" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [conversations]
      operationId: deleteConversation
      summary: Permanently delete a conversation, its messages, runs and run events.
      x-requirements: [API-003, TEN-006]
      responses:
        "204": { description: Conversation deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RunInProgress" }

  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: listMessages
      summary: The history of a path, oldest first, as AG-UI messages.
      description: |
        A projection of the stored Pydantic AI messages (ADR-0031), in the AG-UI
        message format, including tool calls and tool results. By default the
        active path; with `run_id`, the path ending at that run, which lets a
        client show another version without switching to it (ADR-0037). Each
        page also describes the runs of its messages and their versions.
      x-requirements: [API-003, CNV-001, TEN-006]
      parameters:
        - name: run_id
          in: query
          description: Last run of the path to read; defaults to the active run.
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /conversations/{conversation_id}/runs:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [runs]
      operationId: startRun
      summary: Start a run (AG-UI compatible) and stream its events.
      description: |
        Accepts an AG-UI `RunAgentInput`. Only the last user message, the
        `resume` answers and `parentRunId` are used; history is managed by the
        server (ADR-0031). Without `parentRunId` the run continues the active
        path; with it, the run continues the path ending at that run, creating
        a new version when that run already has children (CNV-001, ADR-0037).
        The new run becomes the active run. The run executes in a worker and continues if the client
        disconnects (AGT-009); reconnect with `GET /runs/{run_id}/events`.
        A `runId` that already exists in this conversation returns that run's
        stream from the beginning, so a retried request does not start a
        second run. Errors detected before the run starts are returned as
        HTTP problems; errors after it starts arrive as `RUN_ERROR`.
      x-requirements: [AGT-009, API-003, API-004, CNV-001, CNV-002, TEN-006]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunAgentInput" }
      responses:
        "200":
          description: The run's AG-UI events, as Server-Sent Events.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages whose `data` field is a JSON-encoded AG-UI event.
              x-event-schema: { $ref: "#/components/schemas/AgUiEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            A run is in progress (`run.in_progress`), an interrupt is pending
            (`run.interrupt_pending`), or neither the tenant nor the instance
            has a default model (`model.unavailable`, ADR-0052).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: getRun
      x-requirements: [AGT-009, AGT-010, TEN-006]
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Stop a queued or running run.
      description: |
        No further model or tool calls start; messages produced so far are
        kept, and the run ends with status `cancelled` (CNV-003, ADR-0037).
        Its event stream ends with `RUN_ERROR` carrying the code
        `run.cancelled`. Cancelling a run that has already ended returns it
        unchanged.
      x-requirements: [CNV-003, TEN-006]
      responses:
        "200":
          description: The run, cancelled or already ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Resume the events of a run (Mazzamurello extension to AG-UI).
      description: |
        Sends every event with a sequence number greater than the one given in
        `Last-Event-ID` (or `after`), then follows new events until the run
        ends. The stream closes after `RUN_FINISHED` (including a finish with
        an `interrupt` outcome) or `RUN_ERROR` (API-004, ADR-0032).
      x-requirements: [API-004, AGT-009, CNV-015, TEN-006]
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last sequence number received, sent by SSE clients on reconnection.
          schema: { type: integer, minimum: 0 }
        - name: after
          in: query
          description: Same as `Last-Event-ID`, for clients that cannot set headers.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The run's AG-UI events after the given sequence number.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages whose `data` field is a JSON-encoded AG-UI event.
              x-event-schema: { $ref: "#/components/schemas/AgUiEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Readiness of the instance.
      description: |
        Anonymous callers receive only `status`. Instance admins also receive
        the individual checks (OPS-002). The status is `unavailable` when the
        database is unreachable or the sandbox driver refuses sandboxes, then
        the answer is `503`; `degraded` when no instance default model is
        configured; `ok` otherwise (ADR-0054).
      x-requirements: [OPS-002, SBX-003, SBX-015, SBX-017]
      security: [{}, { deviceSession: [] }]
      responses:
        "200":
          description: The instance is ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The instance is not ready; sandboxes are refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

components:
  securitySchemes:
    deviceSession:
      type: http
      scheme: bearer
      description: Opaque device session token (ADR-0025, AUTH-004).

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ModelId:
      name: model_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Unauthenticated:
      description: Missing, invalid, expired or revoked session token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Unauthenticated", status: 401, code: "auth.unauthenticated" }
    InvalidCredentials:
      description: Wrong username or password.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Invalid credentials", status: 401, code: "auth.invalid_credentials" }
    RateLimited:
      description: Too many attempts; retry after the indicated delay.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Too many attempts", status: 429, code: "auth.rate_limited" }
    Forbidden:
      description: The user's role does not allow this operation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Forbidden", status: 403, code: "permission.denied" }
    NotFound:
      description: The resource does not exist or belongs to someone else.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Not found", status: 404, code: "resource.not_found" }
    Conflict:
      description: A resource with the same unique name already exists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Conflict", status: 409, code: "resource.conflict" }
    RunInProgress:
      description: |
        A run is in progress in this conversation (`run.in_progress`), or an
        interrupt is pending and the request does not answer it
        (`run.interrupt_pending`).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Run in progress", status: 409, code: "run.in_progress" }
    ValidationFailed:
      description: The request body or parameters are invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "about:blank", title: "Validation failed", status: 422, code: "request.validation_failed" }

  schemas:
    Id:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    ErrorCode:
      type: string
      description: Stable, machine-readable error code (API-007).
      enum:
        - auth.unauthenticated
        - auth.invalid_credentials
        - auth.rate_limited
        - permission.denied
        - resource.not_found
        - resource.conflict
        - request.validation_failed
        - run.in_progress
        - run.interrupt_pending
        - run.cancelled
        - approval.invalid
        - run.worker_lost
        - run.timeout
        - model.unavailable
        - model.request_failed
        - sandbox.unavailable
        - sandbox.command_failed
        - internal.error

    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        errors:
          type: array
          description: Field-level details for `request.validation_failed`.
          items:
            type: object
            required: [location, code]
            properties:
              location: { type: string, description: "JSON pointer or parameter name." }
              code: { type: string }

    LoginRequest:
      type: object
      required: [username, password, device_name]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        device_name: { type: string, minLength: 1, maxLength: 100 }

    LoginResponse:
      type: object
      required: [token, session, user]
      properties:
        token:
          type: string
          description: Opaque session token. Shown only once; store it securely.
        session: { $ref: "#/components/schemas/DeviceSession" }
        user: { $ref: "#/components/schemas/User" }

    DeviceSession:
      type: object
      required: [id, device_name, created_at, last_used_at, expires_at, current]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        device_name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          description: 90 days after the last use (ADR-0049).
          allOf:
            - $ref: "#/components/schemas/Timestamp"
        current: { type: boolean, description: "True for the session making the request." }

    Role:
      type: string
      enum: [member, tenant_admin]

    User:
      type: object
      required: [id, tenant_id, username, display_name, role, instance_admin, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        tenant_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        instance_admin: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: [string, "null"] }

    CreateUserRequest:
      type: object
      required: [username, display_name, password, role]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{1,63}$"
          description: Unique across the instance.
        display_name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
        role: { $ref: "#/components/schemas/Role" }

    Tenant:
      type: object
      required: [id, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    TenantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_cursor: { type: [string, "null"] }

    CreateTenantRequest:
      type: object
      required: [name, admin]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        admin:
          description: The tenant's first tenant admin; `role` must be `tenant_admin`.
          allOf:
            - $ref: "#/components/schemas/CreateUserRequest"

    Decimal:
      type: string
      pattern: "^[0-9]{1,10}(\\.[0-9]{1,10})?$"
      description: A non-negative decimal number, as a string so that no precision is lost.
    ModelPrices:
      type: object
      description: Prices per million tokens, in one currency (ADR-0042).
      required: [input, output, currency]
      additionalProperties: false
      properties:
        input: { $ref: "#/components/schemas/Decimal" }
        cached_input: { $ref: "#/components/schemas/Decimal" }
        output: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "ISO 4217 code." }
    ModelApi:
      type: string
      description: |
        The API of the endpoint (ADR-0057): `openai` for any OpenAI-compatible
        chat completions endpoint, `openrouter` for OpenRouter's.
      enum: [openai, openrouter]
    ModelConfiguration:
      type: object
      description: |
        A model of a provider made available by an admin (ADR-0051). The API key
        is never returned; `has_api_key` says whether one is set.
      required: [id, name, api, base_url, model, has_api_key, paid, prices, is_default, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        api: { $ref: "#/components/schemas/ModelApi" }
        base_url: { type: string, format: uri }
        model: { type: string }
        has_api_key: { type: boolean }
        paid: { type: boolean, description: "Whether the provider charges per token." }
        prices:
          oneOf:
            - $ref: "#/components/schemas/ModelPrices"
            - type: "null"
        is_default: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    CreateModelConfigurationRequest:
      type: object
      description: |
        Tenant models must use an `https` endpoint that resolves only to public
        addresses; anything else is rejected with `request.validation_failed`
        at `/base_url` (ADR-0051). Making a configuration the default makes the
        previous default of the same scope a plain configuration.
      required: [name, base_url, model, paid]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        api: { allOf: [{ $ref: "#/components/schemas/ModelApi" }], default: openai }
        base_url: { type: string, format: uri, maxLength: 2000, description: "Endpoint of the API, such as `http://192.168.1.10:11434/v1` or `https://openrouter.ai/api/v1`." }
        model: { type: string, minLength: 1, maxLength: 200 }
        api_key: { type: string, minLength: 1, maxLength: 1000, writeOnly: true }
        paid: { type: boolean }
        prices: { $ref: "#/components/schemas/ModelPrices" }
        is_default: { type: boolean, default: false }
    UpdateModelConfigurationRequest:
      type: object
      description: Fields to change. `api_key` and `prices` set to `null` remove them.
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        api: { $ref: "#/components/schemas/ModelApi" }
        base_url: { type: string, format: uri, maxLength: 2000 }
        model: { type: string, minLength: 1, maxLength: 200 }
        api_key: { oneOf: [{ type: string, minLength: 1, maxLength: 1000 }, { type: "null" }], writeOnly: true }
        paid: { type: boolean }
        prices: { oneOf: [{ $ref: "#/components/schemas/ModelPrices" }, { type: "null" }] }
        is_default: { type: boolean }

    Conversation:
      type: object
      required: [id, title, archived, active_run_id, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title:
          type: string
          description: Empty while the conversation is untitled; clients show their own placeholder (ADR-0052).
        archived: { type: boolean }
        active_run_id:
          description: Last run of the active path (ADR-0037); null before the first run.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    ConversationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        next_cursor: { type: [string, "null"] }

    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }

    UpdateConversationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        archived: { type: boolean }
        active_run_id: { $ref: "#/components/schemas/Id" }

    AgUiMessage:
      type: object
      description: |
        A message in the AG-UI 1.0 format (roles such as `user`, `assistant`,
        `tool`, `reasoning`), projected from the stored Pydantic AI messages.
        See https://docs.ag-ui.com/ for the full definition.
      required: [id, role]
      additionalProperties: true
      properties:
        id: { type: string }
        role: { type: string }
        content: {}

    MessagePage:
      type: object
      required: [items, runs]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgUiMessage" }
        runs:
          type: array
          description: The runs of the path that produced the messages of this page, in path order.
          items: { $ref: "#/components/schemas/PathRun" }
        next_cursor: { type: [string, "null"] }

    PathRun:
      type: object
      description: |
        One run of a path and its versions (ADR-0037). `versions` lists the
        runs of kind `message` with the same parent, oldest first, including
        this one; a client shows "2 / 3" from it and reads another version with
        `run_id`.
      required: [run_id, parent_run_id, kind, message_ids, versions]
      properties:
        run_id: { $ref: "#/components/schemas/Id" }
        parent_run_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        kind: { $ref: "#/components/schemas/RunKind" }
        message_ids:
          type: array
          description: IDs of the AG-UI messages, in `items`, that this run produced.
          items: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/Id" }

    RunAgentInput:
      type: object
      description: |
        The AG-UI 1.0 run input. Fields not listed here are accepted and
        ignored; in particular, client-provided history, tools, context and
        state are never used (ADR-0031).
      required: [threadId, runId, messages]
      additionalProperties: true
      properties:
        threadId:
          $ref: "#/components/schemas/Id"
          description: Must equal the conversation ID in the path.
        runId:
          $ref: "#/components/schemas/Id"
          description: Chosen by the client; becomes the run ID.
        parentRunId:
          $ref: "#/components/schemas/Id"
          description: |
            The run to continue (AG-UI branching). Omit it to continue the
            active path; never send `null`. Ignored when `resume` is given:
            a resume always continues the interrupted run.
        messages:
          type: array
          description: Only the last message is used, and it must have role `user`, unless `resume` is given.
          items: { $ref: "#/components/schemas/AgUiMessage" }
        resume:
          type: array
          description: Answers to the pending interrupts of the conversation (ADR-0033).
          items:
            type: object
            required: [interruptId, status]
            additionalProperties: false
            properties:
              interruptId: { type: string }
              status: { type: string, enum: [resolved, cancelled] }
              payload:
                description: 'For approvals, `{"approved": true|false}`.'

    ModelRef:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string }
        model: { type: string }

    RunStatus:
      type: string
      enum: [queued, running, interrupted, completed, failed, cancelled]

    RunKind:
      type: string
      description: "`message` starts a turn or a version of one; `resume` answers an interrupt (ADR-0033)."
      enum: [message, resume]

    Run:
      type: object
      required: [id, conversation_id, parent_run_id, kind, status, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        conversation_id: { $ref: "#/components/schemas/Id" }
        parent_run_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        kind: { $ref: "#/components/schemas/RunKind" }
        status: { $ref: "#/components/schemas/RunStatus" }
        error_code:
          description: Set when `status` is `failed`.
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        model:
          description: Provider and model that answered (MOD-005).
          oneOf:
            - $ref: "#/components/schemas/ModelRef"
            - type: "null"
        last_event_seq: { type: integer, minimum: 0 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        finished_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    AgUiEvent:
      type: object
      description: |
        An AG-UI 1.0 event (https://docs.ag-ui.com/). The types below are the
        ones Mazzamurello emits; clients must ignore unknown types.
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          enum:
            - RUN_STARTED
            - RUN_FINISHED
            - RUN_ERROR
            - STEP_STARTED
            - STEP_FINISHED
            - TEXT_MESSAGE_START
            - TEXT_MESSAGE_CONTENT
            - TEXT_MESSAGE_END
            - TOOL_CALL_START
            - TOOL_CALL_ARGS
            - TOOL_CALL_END
            - TOOL_CALL_RESULT
            - REASONING_START
            - REASONING_MESSAGE_START
            - REASONING_MESSAGE_CONTENT
            - REASONING_MESSAGE_END
            - REASONING_END
            - CUSTOM

    HealthStatus:
      type: string
      enum: [ok, degraded, unavailable]

    Health:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        checks:
          type: object
          description: Present only for instance admins.
          properties:
            database: { $ref: "#/components/schemas/HealthStatus" }
            platform: { $ref: "#/components/schemas/HealthStatus" }
            sandbox_driver: { $ref: "#/components/schemas/HealthStatus" }
            isolation_runtime: { $ref: "#/components/schemas/HealthStatus" }
            egress_table: { $ref: "#/components/schemas/HealthStatus" }
            model_gateway: { $ref: "#/components/schemas/HealthStatus" }
