name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default (REPO-007). No job in this workflow uses secrets,
# so it is safe to run on pull requests from forks (REPO-008).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Spec lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check specs (REPO-003)
        run: python3 tools/check_specs.py

  tooling-tests:
    name: Tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tooling tests
        run: python3 -m unittest discover -s tests/tooling -t . -v

  traceability:
    name: Traceability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check requirement references in tests (REPO-004)
        run: python3 tools/check_traceability.py

  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock file (REPO-009)
        run: uv sync --locked --all-packages
      - name: Formatter check
        run: uv run --locked ruff format --check
      - name: Linter
        run: uv run --locked ruff check
      - name: Type checker (strict)
        run: uv run --locked pyright

  # The tests run in parallel jobs, each on its own runner with its own
  # Docker and host firewall, within a time budget (REPO-011, ADR-0059): no
  # test may take longer than MAX_TEST_SECONDS, and each part's session no
  # longer than its budget. Raising a budget takes a rules/ pull request.
  tests:
    name: Tests (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            paths: tests/design tests/integration tests/tooling --ignore=tests/integration/test_sandbox_driver.py
            budget: 240
          - part: sandbox
            paths: tests/security tests/integration/test_sandbox_driver.py
            budget: 180
          - part: end-to-end
            paths: tests/e2e
            budget: 180
    env:
      MAX_TEST_SECONDS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock file (REPO-009)
        run: uv sync --locked --all-packages
      # Sandbox tests run under gVisor (ADR-0023, ADR-0053): install the
      # release the project is tested with from gVisor's official repository
      # and register it with Docker.
      - name: Install gVisor
        env:
          GVISOR_RELEASE: "20261026"
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases ${GVISOR_RELEASE} main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker
          docker run --rm --runtime=runsc hello-world >/dev/null
          runsc --version
      - name: Tests
        env:
          TEST_PATHS: ${{ matrix.paths }}
        # TEST_PATHS is word-split on purpose: it lists paths and options.
        run: uv run --locked pytest $TEST_PATHS --junitxml=test-report.xml -o junit_duration_report=call
      - name: Test time (REPO-011)
        if: success() || failure()
        env:
          BUDGET: ${{ matrix.budget }}
        run: >-
          python3 tools/check_test_durations.py --junit test-report.xml
          --max-test-seconds "$MAX_TEST_SECONDS" --max-session-seconds "$BUDGET"

  # The check that branch rulesets require: it passes only when the lint and
  # every part of the tests passed.
  python:
    name: Python checks
    if: always()
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lint, types and every part of the tests passed
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint: $LINT, tests: $TESTS"
          for result in "$LINT" "$TESTS"; do
            [ "$result" = success ] || exit 1
          done

  # ty runs in preview, without blocking merges, until it meets the switch
  # criteria of ADR-0029; pyright above remains the required gate.
  ty-preview:
    name: Type checker preview (ty)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the Python workspace
        id: workspace
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml yet: nothing to check."
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.workspace.outputs.present == 'true'
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock file
        if: steps.workspace.outputs.present == 'true'
        run: uv sync --locked --all-packages
      - name: ty check
        if: steps.workspace.outputs.present == 'true'
        run: uv run --locked ty check

  pr-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Branch names are attacker-controlled: pass them through the
      # environment, never interpolate them into the script.
      - name: Check allowed paths (REPO-001)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_pr_paths.py --branch "$HEAD_REF" --base "origin/$BASE_REF" --head HEAD
      - name: Check DCO sign-off (REPO-002)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_dco.py --base "origin/$BASE_REF" --head HEAD
