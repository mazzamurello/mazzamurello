name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default (REPO-007). No job in this workflow uses secrets,
# so it is safe to run on pull requests from forks (REPO-008).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Spec lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check specs (REPO-003)
        run: python3 tools/check_specs.py

  tooling-tests:
    name: Tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tooling tests
        run: python3 -m unittest discover -s tests/tooling -t . -v
      - name: Check the workflows (REPO-007, REPO-008, REPO-009)
        run: python3 tools/check_workflows.py

  traceability:
    name: Traceability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check requirement references in tests (REPO-004)
        run: python3 tools/check_traceability.py

  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock file (REPO-009)
        run: uv sync --locked --all-packages
      - name: Formatter check
        run: uv run --locked ruff format --check
      - name: Linter
        run: uv run --locked ruff check
      - name: Type checker (strict)
        run: uv run --locked pyright

  # The tests run in parallel jobs, each on its own runner with its own
  # Docker and host firewall, within a time budget (REPO-011, ADR-0059): no
  # test may take longer than MAX_TEST_SECONDS, and each part's session no
  # longer than its budget. Raising a budget takes a rules/ pull request.
  tests:
    name: Tests (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            paths: >-
              tests/design tests/integration tests/tooling
              --ignore=tests/integration/test_sandbox_driver.py --ignore=tests/integration/test_runs_api.py
              --ignore=tests/integration/test_agent_tools.py --ignore=tests/integration/test_remote_provider.py
              --ignore=tests/integration/test_rewinding.py --ignore=tests/integration/test_models_api.py
              --ignore=tests/integration/test_titles_and_compaction.py --ignore=tests/integration/test_usage.py
              --ignore=tests/integration/test_forks.py --ignore=tests/integration/test_conversation_list.py
              --ignore=tests/integration/test_workspace_files.py --ignore=tests/integration/test_conversation_files.py
            budget: 130
          - part: runs
            paths: tests/integration/test_runs_api.py tests/integration/test_agent_tools.py
            budget: 150
          - part: conversations
            paths: >-
              tests/integration/test_rewinding.py tests/integration/test_models_api.py
              tests/integration/test_remote_provider.py
            budget: 150
          # Titles, compaction, costs, forks, folders and search (ADR-0073).
          - part: library
            paths: >-
              tests/integration/test_titles_and_compaction.py tests/integration/test_usage.py
              tests/integration/test_forks.py tests/integration/test_conversation_list.py
            budget: 150
          # Files in a conversation (ADR-0079): every file operation starts a container.
          - part: files
            paths: tests/integration/test_workspace_files.py tests/integration/test_conversation_files.py
            budget: 90
          - part: sandbox
            paths: tests/security tests/integration/test_sandbox_driver.py
            budget: 150
          # The server image now builds the web app as well (ADR-0067).
          - part: end-to-end
            paths: tests/e2e/test_deployment.py
            budget: 150
          # Backing a deployment up, installing it again and restoring it
          # (OPS-006, ADR-0077): two installations and a backup, in a part of
          # their own, so that the other parts do not wait for them.
          - part: restore
            paths: tests/e2e/test_restore.py
            budget: 240
          # The web client in Chromium, and its unit tests (ADR-0067). Its
          # browser tests grew with the daily-use conversations (ADR-0073).
          - part: web
            paths: tests/web
            budget: 150
    env:
      MAX_TEST_SECONDS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock file (REPO-009)
        run: uv sync --locked --all-packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.part == 'web' && hashFiles('src/web/package.json') != ''
        with:
          node-version: "24.14.1"
      - name: Install the web app from its lock file, and run its unit tests
        if: matrix.part == 'web' && hashFiles('src/web/package.json') != ''
        # From the app's directory, so that corepack runs the pnpm its package.json names.
        working-directory: src/web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
      # The browser is kept between runs for the Playwright version in the
      # lock file; its system libraries still come from apt on every runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.part == 'web' && hashFiles('src/web/package.json') != ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium for the browser tests
        if: matrix.part == 'web' && hashFiles('src/web/package.json') != ''
        # It takes under a minute; a stalled download fails the job instead of holding it.
        timeout-minutes: 5
        run: uv run --locked playwright install --with-deps chromium
      # Sandbox tests run under gVisor (ADR-0023, ADR-0053): install the
      # release the project is tested with from gVisor's official repository
      # and register it with Docker.
      - name: Install gVisor
        env:
          GVISOR_RELEASE: "20261026"
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases ${GVISOR_RELEASE} main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker
          docker run --rm --runtime=runsc hello-world >/dev/null
          runsc --version
      # The images are built with Docker's build cache, kept between runs, and
      # handed to the tests, which then do not build them again (ADR-0059).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the sandbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/sandbox/Dockerfile
          load: true
          tags: mazzamurello-test/sandbox:ci,mazzamurello/sandbox:local
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Build the network guard image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/netguard/Dockerfile
          load: true
          tags: mazzamurello-test/netguard:ci,mazzamurello/netguard:local
          cache-from: type=gha,scope=netguard
          cache-to: type=gha,mode=max,scope=netguard
      - name: Build the server image
        if: matrix.part == 'end-to-end' || matrix.part == 'restore'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/server/Dockerfile
          load: true
          tags: mazzamurello/server:local
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build the sandbox driver image
        if: matrix.part == 'end-to-end' || matrix.part == 'restore'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/sandboxd/Dockerfile
          load: true
          tags: mazzamurello/sandboxd:local
          cache-from: type=gha,scope=sandboxd
          cache-to: type=gha,mode=max,scope=sandboxd
      - name: Tests
        # A part whose tests do not exist yet, on a branch from before them, has nothing to run.
        if: matrix.part != 'web' || hashFiles('tests/web/conftest.py') != ''
        env:
          TEST_PATHS: ${{ matrix.paths }}
          # Built above: the tests use them instead of building their own
          # (specs/contracts/test-harness.md).
          TEST_SANDBOX_IMAGE: mazzamurello-test/sandbox:ci
          TEST_NETGUARD_IMAGE: mazzamurello-test/netguard:ci
          TEST_DEPLOYMENT_IMAGES: built
        # TEST_PATHS is word-split on purpose: it lists paths and options. Listed
        # test files a branch does not have yet are left out, so that a rules
        # change can name the files of a milestone before the milestone merges.
        run: |
          args=()
          for arg in $TEST_PATHS; do
            case "$arg" in
              tests/*) if [ -e "${arg%%::*}" ]; then args+=("$arg"); fi ;;
              *) args+=("$arg") ;;
            esac
          done
          if ! printf '%s\n' "${args[@]}" | grep -q '^tests/'; then
            echo "No tests of this part on this branch."
            exit 0
          fi
          uv run --locked pytest "${args[@]}" --junitxml=test-report.xml -o junit_duration_report=call
      - name: Test time (REPO-011)
        if: (success() || failure()) && hashFiles('test-report.xml') != ''
        env:
          BUDGET: ${{ matrix.budget }}
        run: >-
          python3 tools/check_test_durations.py --junit test-report.xml
          --max-test-seconds "$MAX_TEST_SECONDS" --max-session-seconds "$BUDGET"

  # The check that branch rulesets require: it passes only when the lint and
  # every part of the tests passed.
  python:
    name: Python checks
    if: always()
    needs: [lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lint, types and every part of the tests passed
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint: $LINT, tests: $TESTS"
          for result in "$LINT" "$TESTS"; do
            [ "$result" = success ] || exit 1
          done

  # ty runs in preview, without blocking merges, until it meets the switch
  # criteria of ADR-0029; pyright above remains the required gate.
  ty-preview:
    name: Type checker preview (ty)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the Python workspace
        id: workspace
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml yet: nothing to check."
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.workspace.outputs.present == 'true'
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock file
        if: steps.workspace.outputs.present == 'true'
        run: uv sync --locked --all-packages
      - name: ty check
        if: steps.workspace.outputs.present == 'true'
        run: uv run --locked ty check

  pr-policy:
    name: Pull request policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Branch names are attacker-controlled: pass them through the
      # environment, never interpolate them into the script.
      - name: Check allowed paths (REPO-001)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_pr_paths.py --branch "$HEAD_REF" --base "origin/$BASE_REF" --head HEAD
      - name: Check DCO sign-off (REPO-002)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 tools/check_dco.py --base "origin/$BASE_REF" --head HEAD
