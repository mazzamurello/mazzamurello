name: Spec proposal
description: Propose a new requirement or a change to an existing one.
labels: ["spec", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        In Mazzamurello, every feature starts as a spec. Describe the need
        first; requirements and ADRs follow in a `spec/*` pull request.
        Please check [VISION.md](https://github.com/mazzamurello/mazzamurello/blob/master/VISION.md) for the project's scope.
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Who needs this, what they want to do, and why.
      placeholder: |
        As a <kind of user>,
        I want <goal>,
        so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. Anything that helps understand the need — current workarounds, examples, links.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How do we know the story is done? Ideally as MUST/SHOULD/MAY statements; they become the requirements.
      placeholder: |
        - The system MUST …
        - The system SHOULD …
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related requirements or ADRs
      placeholder: "e.g. AGT-004, ADR-0012"
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Does this touch user data, sandboxes, tools, models or the network?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
