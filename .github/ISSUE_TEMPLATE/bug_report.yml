name: Bug report
description: Something does not behave as the specs say it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues must not be reported here** —
        use private vulnerability reporting (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: Which requirement(s) does the observed behavior violate, if known?
      placeholder: "e.g. API-003"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or screencasts
      description: Optional. Drag and drop images or videos showing the problem. Remove any personal data first.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS and architecture, Docker version, sandbox runtime, model provider.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any personal data before pasting.
      render: text
