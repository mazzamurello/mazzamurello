[project]
name = "mazzamurello-sandboxd"
version = "0.0.0"
description = "Mazzamurello sandbox driver: sole holder of container runtime access (ADR-0022)."
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "aiodocker==0.27.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mazzamurello_sandboxd"
module-root = ""
