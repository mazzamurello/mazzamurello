# Sibillo on one host with Docker Compose (OPS-001, ADR-0054).
#
#   docker compose run --rm --no-deps init   # writes .env with fresh secrets
#   docker compose up --detach --build --wait
#   docker compose run --rm setup            # creates the first administrator
#
# Only the API is published (OPS-003). Every setting comes from .env; see
# specs/contracts/configuration.md.

name: sibillo

x-server: &server
  image: sibillo/server:local
  build:
    context: ..
    dockerfile: deploy/images/server/Dockerfile
  networks: [internal]
  restart: unless-stopped

x-app-database: &app-database
  SIBILLO_DATABASE_URL: postgresql://sibillo_app:${SIBILLO_APP_PASSWORD:-}@postgres:5432/sibillo

x-owner-database: &owner-database
  SIBILLO_DATABASE_URL: postgresql://sibillo_owner:${SIBILLO_OWNER_PASSWORD:-}@postgres:5432/sibillo

# Backups and restores read the database as PostgreSQL's superuser (ADR-0077).
x-backup-environment: &backup-environment
  SIBILLO_DATABASE_URL: postgresql://postgres:${SIBILLO_POSTGRES_PASSWORD:-}@postgres:5432/sibillo
  SIBILLO_SECRET_KEY: ${SIBILLO_SECRET_KEY:-}
  SIBILLO_BACKUP_KEY: ${SIBILLO_BACKUP_KEY:-}
  SIBILLO_SANDBOXD_URL: http://sandboxd:8100/v1
  SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
  SIBILLO_BACKUP_TIME: ${SIBILLO_BACKUP_TIME:-03:00}
  SIBILLO_BACKUP_KEEP: ${SIBILLO_BACKUP_KEEP:-14}

networks:
  internal: {}
  # The worker and the search service, and nothing else (ADR-0075).
  search: {}

volumes:
  postgres: {}

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_PASSWORD: ${SIBILLO_POSTGRES_PASSWORD:-}
      SIBILLO_OWNER_PASSWORD: ${SIBILLO_OWNER_PASSWORD:-}
      SIBILLO_APP_PASSWORD: ${SIBILLO_APP_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/initdb.sh:/docker-entrypoint-initdb.d/10-sibillo.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--dbname", "sibillo"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  migrate:
    <<: *server
    command: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    environment:
      <<: *owner-database
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *server
    command: ["sibillo_server", "api"]
    environment:
      <<: *app-database
      SIBILLO_HTTP_PORT: "8000"
      SIBILLO_SECRET_KEY: ${SIBILLO_SECRET_KEY:-}
      SIBILLO_TRUSTED_PROXIES: ${SIBILLO_TRUSTED_PROXIES:-}
      SIBILLO_UPLOAD_MAX_MB: ${SIBILLO_UPLOAD_MAX_MB:-1024}
      SIBILLO_SANDBOXD_URL: http://sandboxd:8100/v1
      SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
      # A failing backup makes the health degraded (OPS-011).
      SIBILLO_BACKUP_STATUS: /backups/status.json
    volumes:
      - ${SIBILLO_BACKUP_DIR:-./backups}:/backups:ro
    # The single entry point (OPS-003); HTTPS comes from a reverse proxy.
    ports:
      - "${SIBILLO_PUBLISH:-127.0.0.1:8080}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandboxd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 40

  worker:
    <<: *server
    command: ["sibillo_server", "worker"]
    environment:
      <<: *app-database
      SIBILLO_SECRET_KEY: ${SIBILLO_SECRET_KEY:-}
      SIBILLO_RUN_RETENTION_DAYS: ${SIBILLO_RUN_RETENTION_DAYS:-30}
      SIBILLO_TEMPORARY_SWEEP_SECONDS: ${SIBILLO_TEMPORARY_SWEEP_SECONDS:-600}
      SIBILLO_APPROVAL_SWEEP_SECONDS: ${SIBILLO_APPROVAL_SWEEP_SECONDS:-60}
      SIBILLO_SANDBOXD_URL: http://sandboxd:8100/v1
      SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
      SIBILLO_SEARCH_URL: http://search:8080
    networks: [internal, search]
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandboxd: { condition: service_healthy }
      search: { condition: service_healthy }

  sandboxd:
    image: sibillo/sandboxd:local
    build:
      context: ..
      dockerfile: deploy/images/sandboxd/Dockerfile
    environment:
      SIBILLO_SANDBOXD_TOKEN: ${SIBILLO_SANDBOXD_TOKEN:-}
      SIBILLO_SANDBOX_IMAGE: sibillo/sandbox:local
      SIBILLO_NETGUARD_CONTAINER: sibillo-netguard
      SIBILLO_SANDBOX_MINIMUM_GVISOR_RELEASE: ${SIBILLO_SANDBOX_MINIMUM_GVISOR_RELEASE:-}
      SIBILLO_SANDBOX_RESOLVER: ${SIBILLO_SANDBOX_RESOLVER:-9.9.9.9}
      SIBILLO_SANDBOX_CPUS: ${SIBILLO_SANDBOX_CPUS:-1}
      SIBILLO_SANDBOX_MEMORY_MB: ${SIBILLO_SANDBOX_MEMORY_MB:-1024}
      SIBILLO_SANDBOX_PROCESSES: ${SIBILLO_SANDBOX_PROCESSES:-512}
      SIBILLO_SANDBOX_COMMAND_TIMEOUT_SECONDS: ${SIBILLO_SANDBOX_COMMAND_TIMEOUT_SECONDS:-300}
      SIBILLO_SANDBOX_MAX_OUTPUT_BYTES: ${SIBILLO_SANDBOX_MAX_OUTPUT_BYTES:-1048576}
      SIBILLO_SANDBOX_IDLE_MINUTES: ${SIBILLO_SANDBOX_IDLE_MINUTES:-5}
    # The only service with the container runtime (SBX-009).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      netguard: { condition: service_healthy }
      sandbox: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8100/v1/health', headers={'Authorization': 'Bearer ' + os.environ['SIBILLO_SANDBOXD_TOKEN']}), timeout=5)"
      interval: 3s
      timeout: 10s
      retries: 60
    networks: [internal]
    restart: unless-stopped

  # Backs the instance up every night, keeping the newest archives (OPS-010, ADR-0077).
  backup:
    <<: *server
    command: ["sibillo_server", "backup", "--schedule"]
    # Writes archives into the host's backup folder.
    user: "0:0"
    environment:
      <<: *backup-environment
    volumes:
      - ${SIBILLO_BACKUP_DIR:-./backups}:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandboxd: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "test", "-f", "/backups/status.json"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Restores an archive: `docker compose run --rm restore /backups/FILE` (OPS-006).
  restore:
    <<: *server
    entrypoint: ["python", "-m", "sibillo_server", "restore", "--config", "/config/.env"]
    command: []
    user: "0:0"
    environment:
      <<: *backup-environment
    volumes:
      - ${SIBILLO_CONFIG_DIR:-.}:/config
      - ${SIBILLO_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
      sandboxd: { condition: service_healthy }
    restart: "no"
    profiles: [operator]

  # The search service (ADR-0075): SearXNG, which only the worker reaches.
  search:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    # Its secret, for its own pages, is new at every start.
    entrypoint:
      - /bin/sh
      - -c
      - export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"; exec /usr/local/searxng/entrypoint.sh
    environment:
      # The settings are mounted read-only.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./search/settings.yml:/etc/searxng/settings.yml:ro
    # SearXNG logs failed engine requests with their queries: no logs (OBS-001).
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 40
    networks: [search]
    restart: unless-stopped

  netguard:
    image: sibillo/netguard:local
    build:
      context: ..
      dockerfile: deploy/images/netguard/Dockerfile
    # Host networking and NET_ADMIN, nothing else (ADR-0021).
    container_name: sibillo-netguard
    network_mode: host
    cap_add: [NET_ADMIN]
    stop_grace_period: 15s
    restart: unless-stopped

  # Builds the sandbox image for the driver, then exits.
  sandbox:
    image: sibillo/sandbox:local
    build:
      context: ..
      dockerfile: deploy/images/sandbox/Dockerfile
    command: ["true"]
    network_mode: none
    restart: "no"

  init:
    <<: *server
    command: ["sibillo_server", "init", "--output", "/config/.env"]
    user: "0:0"
    volumes:
      - ${SIBILLO_CONFIG_DIR:-.}:/config
    networks: []
    network_mode: none
    restart: "no"
    profiles: [operator]

  setup:
    <<: *server
    command: ["sibillo_server", "setup"]
    environment:
      <<: *owner-database
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"
    profiles: [operator]
